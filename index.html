<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F1;
  --beige:#EEDFC4;
  --ink:#14120F;
  --ink-alt:#241C13;
  --accent:#F0AC3C;
  --accent-deep:#7A4A12;
  --accent-2:#2E9C8C;
  --line:rgba(20,18,15,.14);
  --line-light:rgba(250,247,241,.16);

  --bg-1:var(--paper);
  --bg-2:var(--beige);
  --bg-alt-1:var(--ink);
  --bg-alt-2:var(--ink-alt);
  --text:var(--ink);
  --text-alt:var(--paper);
  --header-bg:rgba(250,247,241,.86);
  --muted:#4a453b;
  --muted-alt:#c9c2b4;
}
html[data-theme="dark"]{
  --bg-1:var(--ink);
  --bg-2:var(--ink-alt);
  --bg-alt-1:#0c0a07;
  --bg-alt-2:#191309;
  --text:var(--paper);
  --text-alt:var(--paper);
  --header-bg:rgba(12,10,7,.88);
  --muted:#c9c2b4;
  --muted-alt:#b6ae9d;
  --line:rgba(250,247,241,.14);
  --line-light:rgba(250,247,241,.1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;overflow-x:hidden;}
body{
  font-family:'Space Grotesk',sans-serif;
  color:var(--text);
  background:var(--bg-1);
  animation:bgpulse 14s ease-in-out infinite alternate;
  transition:color .4s ease;
}
@keyframes bgpulse{0%{background-color:var(--bg-1);}100%{background-color:var(--bg-2);}}
.dark-zone{
  background:var(--bg-alt-1);
  color:var(--text-alt);
  animation:bgpulse-alt 16s ease-in-out infinite alternate;
  transition:color .4s ease;
  border-top:1px solid var(--line-light);border-bottom:1px solid var(--line-light);
}
@keyframes bgpulse-alt{0%{background-color:var(--bg-alt-1);}100%{background-color:var(--bg-alt-2);}}

h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:-0.01em;line-height:1.02;}
.mono{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

/* ---------- HEADER ---------- */
header{position:sticky;top:0;z-index:100;background:var(--header-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:background .4s ease;}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;max-width:1240px;margin:0 auto;gap:20px;}

/* .logo и .header-actions — flex:0 0 auto (никогда не сжимаются). Раньше
   у всех трёх детей .header-inner (.logo/nav/.header-actions) была
   дефолтная flex:0 1 auto + min-width:auto — это значит, что ни один из
   них физически не мог стать уже своего контента, и когда все 7 пунктов
   меню + переключатель языка + кнопка "Вход" не помещались в строку,
   всё это наезжало друг на друга и переносилось криво. Теперь ужимается
   только nav.main-nav (см. ниже), а логотип и правый блок — никогда. */
.logo{font-weight:700;font-size:23px;text-transform:uppercase;display:flex;align-items:center;gap:9px;flex:0 0 auto;}
.logo .logo-icon{width:32px;height:32px;border-radius:8px;object-fit:cover;flex:0 0 auto;box-shadow:0 3px 10px rgba(0,0,0,.25);}
.logo .dot{width:9px;height:9px;background:var(--accent);border-radius:50%;display:inline-block;}

/* nav.main-nav — единственный "резиновый" элемент шапки: flex:1 1 auto
   вместе с min-width:0 позволяет ему реально сжиматься (а не наезжать на
   соседей). Если пунктам всё равно не хватает места — они не переносятся
   и не наползают друг на друга, а сама nav становится горизонтально
   прокручиваемой (overflow-x:auto), скроллбар при этом скрыт, а с правого
   края лёгкое затухание — подсказка, что список можно проскроллить. */
nav.main-nav{
  display:flex;align-items:center;gap:20px;
  flex:1 1 auto;min-width:0;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-mask-image:linear-gradient(90deg,#000 90%,transparent 100%);
  mask-image:linear-gradient(90deg,#000 90%,transparent 100%);
}
nav.main-nav::-webkit-scrollbar{display:none;height:0;}
nav.main-nav a{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:6px 0;border-bottom:2px solid transparent;white-space:nowrap;flex:0 0 auto;transition:border-color .2s,color .2s;}
nav.main-nav a:hover{border-color:var(--accent);color:var(--accent-deep);}
nav.main-nav a.nav-link-cta{color:var(--accent-deep);font-weight:700;}
.header-actions{display:flex;align-items:center;gap:14px;flex:0 0 auto;}

.switcher{display:flex;align-items:center;border:1px solid var(--line);border-radius:20px;padding:3px;gap:2px;}
.switcher button{font-size:11px;font-weight:700;letter-spacing:.04em;padding:6px 10px;border-radius:16px;transition:background .2s,color .2s;color:var(--muted);}
.switcher button.active{background:var(--accent);color:var(--paper);}

.theme-toggle{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:border-color .2s,transform .3s;}
.theme-toggle:hover{border-color:var(--accent);transform:rotate(20deg);}
.theme-toggle svg{width:16px;height:16px;stroke:var(--text);}
html[data-theme="dark"] .icon-sun{display:none;}
html:not([data-theme="dark"]) .icon-moon{display:none;}

.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:3px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em;transition:transform .2s, box-shadow .2s, background .2s, color .2s;}
.btn-primary{background:var(--accent);color:var(--paper);}
.btn-primary:hover{background:var(--accent-deep);transform:translateY(-2px);box-shadow:0 10px 22px rgba(201,150,46,.32);}
.btn-outline{border:1.5px solid var(--text);color:var(--text);padding:10.5px 22px;}
.btn-outline:hover{background:var(--text);color:var(--bg-1);}
.link-quiet{font-size:13px;font-weight:600;text-transform:uppercase;}

/* ---------- BANNER SLIDER ---------- */
.banner-slider{position:relative;width:100%;height:64px;overflow:hidden;background:var(--ink);}
.banner-slide{position:absolute;inset:0;display:flex;align-items:center;gap:16px;padding:0 28px;overflow:hidden;text-decoration:none;
  opacity:0;transform:scale(1.05);transition:opacity 1.1s cubic-bezier(.4,0,.2,1),transform 3.2s cubic-bezier(.4,0,.2,1);}
.banner-slide.is-active{opacity:1;transform:scale(1);z-index:1;}
header .banner-slider{border-top:1px solid var(--line-light);}

.banner-blc{background:linear-gradient(100deg,#050e1c 0%,#0c1c33 55%,#050e1c 100%);}
.banner-blc::after{content:"";position:absolute;top:0;right:14%;bottom:0;width:2px;background:linear-gradient(#C9962E,#9C6F1E);opacity:.7;transform:skewX(-18deg);}
.banner-gilam{background:linear-gradient(100deg,#0a8a76 0%,#12b6a0 55%,#0a8a76 100%);}

.banner-icon{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:0 0 auto;box-shadow:0 2px 8px rgba(0,0,0,.25);background:#fff;}
.banner-icon.icon-wide{width:58px;height:32px;object-fit:contain;background:transparent;box-shadow:none;}
.banner-text{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1 1 auto;overflow:hidden;}
.banner-text b{font-size:13px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.banner-text span{font-size:11.5px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.banner-badge{flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,#ff5f5f,#ff8a3d);padding:5px 11px;border-radius:14px;white-space:nowrap;box-shadow:0 2px 10px rgba(255,90,60,.4);animation:bannerBadgePulse 2.4s ease-in-out infinite;}
@keyframes bannerBadgePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
.banner-cta{flex:0 0 auto;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);background:var(--paper);padding:8px 16px;border-radius:20px;transition:transform .2s,box-shadow .2s;white-space:nowrap;}
.banner-slide:hover .banner-cta{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.25);}

@media (max-width:640px){
  .banner-slider{height:58px;}
  .banner-slide{gap:8px;padding:0 14px;}
  .banner-icon{width:28px;height:28px;border-radius:6px;}
  .banner-icon.icon-wide{width:42px;height:24px;}
  .banner-text b{font-size:10.5px;}
  .banner-text span{font-size:9px;}
  .banner-badge{padding:3px 7px;font-size:8.5px;}
  .banner-cta{padding:6px 11px;font-size:9px;}
}
@media (max-width:480px){
  .banner-slider{height:52px;}
  .banner-slide{gap:6px;padding:0 10px;}
  .banner-icon{width:24px;height:24px;border-radius:5px;}
  .banner-icon.icon-wide{width:36px;height:20px;}
  .banner-text b{font-size:9.5px;}
  .banner-text span{font-size:8px;}
  .banner-badge{display:none;}
  .banner-cta{padding:5px 9px;font-size:8px;}
}

/* ---------- HERO ---------- */
.hero-photo-section{
  position:relative;overflow:hidden;
  padding:130px 0 110px;
  min-height:560px;
  display:flex;align-items:center;
  animation:none !important; /* фото — единственный фон, без пульсации */
}
.hero-bg{position:absolute;inset:0;z-index:0;}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block;}
.hero-bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(20,18,15,.94) 0%,rgba(20,18,15,.82) 38%,rgba(20,18,15,.5) 68%,rgba(20,18,15,.22) 100%);
}
.hero-inner{position:relative;z-index:1;max-width:620px;margin:0;}

/* .hero-photo-section — display:flex, а margin:auto на flex-элементе
   центрирует его по главной оси сильнее, чем justify-content — из-за
   этого текст всегда съезжал к центру. margin:0 выше убирает это. */
.hero-inner .eyebrow{color:var(--accent);}
.hero-inner .eyebrow::before{background:var(--accent);}
.hero-inner h1{font-size:clamp(38px,5.2vw,64px);margin-bottom:22px;color:var(--paper);}
.hero-inner h1 em{font-style:normal;color:var(--accent);}
.hero-inner p.lead{font-size:17.5px;line-height:1.55;max-width:460px;color:rgba(250,247,241,.82);margin-bottom:32px;font-weight:400;text-transform:none;}
.hero-cta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.hero-mini-caption{
  margin-top:34px;max-width:360px;padding:16px 20px;border-radius:8px;
  background:rgba(20,18,15,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(250,247,241,.14);
}
.hero-mini-caption h3{font-size:16px;text-transform:none;letter-spacing:0;margin-bottom:4px;color:var(--paper);}
.hero-mini-caption p{font-size:12px;line-height:1.5;color:rgba(250,247,241,.7);font-weight:400;text-transform:none;}

@media(max-width:480px){
  .hero-photo-section{padding:96px 0 64px;min-height:640px;}
  .hero-bg img{object-position:center 30%;}
  .hero-inner .eyebrow{font-size:11px;margin-bottom:14px;}
  .hero-inner h1{font-size:30px;margin-bottom:16px;}
  .hero-inner p.lead{font-size:14.5px;max-width:100%;margin-bottom:24px;}
  .hero-cta{gap:10px;}
  .hero-mini-caption{margin-top:22px;padding:14px 16px;max-width:100%;}
}

/* ---------- STATS ---------- */
.stats{padding:48px 0;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;text-align:center;}
.stats-grid .num{font-weight:700;font-size:38px;color:var(--accent);}
.stats-grid .label{font-size:13px;text-transform:uppercase;letter-spacing:.03em;font-weight:600;margin-top:6px;color:var(--muted-alt);}

/* ---------- MOBILE STICKY CTA ---------- */
.mobile-sticky-cta{display:none;}
@media(max-width:640px){
  .mobile-sticky-cta{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:var(--header-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    transform:translateY(100%);transition:transform .3s ease;
  }
  .mobile-sticky-cta.is-visible{transform:translateY(0);}
  .mobile-sticky-cta .btn{width:100%;justify-content:center;}
}

/* ---------- SECTIONS ---------- */
.section{padding:92px 0;}
.section-head{max-width:640px;margin:0 auto 50px;text-align:center;}
.section-head .eyebrow{justify-content:center;}
.section-head h2{font-size:clamp(27px,3.4vw,40px);}
.section-head p{margin-top:14px;font-size:15.5px;color:var(--muted);text-transform:none;font-weight:400;}

.cat-marquee{overflow:hidden;white-space:nowrap;margin:0 0 44px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);}
.cat-track{display:inline-flex;gap:0;animation:catScroll 34s linear infinite;}
.cat-track span{display:inline-flex;align-items:center;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:0 22px;}
.cat-track span::after{content:"✦";margin-left:22px;color:var(--accent);font-size:11px;}
@keyframes catScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

.grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.fcard{position:relative;aspect-ratio:1/1.05;border-radius:4px;overflow:hidden;border:1px solid var(--line);}
.fcard img{width:100%;height:100%;object-fit:cover;filter:grayscale(35%);transition:filter .35s,transform .5s;}
.fcard:hover img{filter:grayscale(0%);transform:scale(1.06);}
.fcard .overlay{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(0deg,rgba(20,18,15,.9),transparent 75%);color:var(--paper);}
.fcard .overlay .role{font-weight:700;font-size:15px;text-transform:uppercase;}
.fcard .overlay .who{font-size:11px;opacity:.75;letter-spacing:.06em;}
.fcard.cta-card{background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;}
.fcard.cta-card h3{font-size:17px;}

/* ---------- PROFILE CARDS (real freelancers) ---------- */
.fcard.profile-card{cursor:pointer;}
.fcard.profile-card img{object-position:top center;}
.fcard.profile-card .overlay{padding-bottom:92px;}
.write-btn{
  position:absolute;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  background:var(--accent);
  color:var(--paper);
  font-weight:700;
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:.04em;
  padding:9px 18px;
  border-radius:20px;
  white-space:nowrap;
  z-index:2;
  transition:background .2s, transform .2s;
  box-shadow:0 8px 18px rgba(0,0,0,.28);
}
.write-btn:hover{background:var(--accent-deep);transform:translateX(-50%) translateY(-2px);}
.pay-badge{
  position:absolute;left:50%;bottom:52px;transform:translateX(-50%);
  font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;
  color:var(--paper);background:rgba(46,156,140,.9);
  padding:4px 10px;border-radius:10px;white-space:normal;text-align:center;line-height:1.3;
  max-width:88%;z-index:2;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.pay-badge::before{content:"🔒";font-size:9px;flex:0 0 auto;}
@media(max-width:480px){.pay-badge{bottom:42px;font-size:7.5px;padding:3px 7px;max-width:90%;}}

/* ---------- PROFILE MODAL ---------- */
.profile-modal-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(20,18,15,.72);
  backdrop-filter:blur(6px);
  display:none;
  align-items:center;justify-content:center;
  padding:24px;
  opacity:0;
  transition:opacity .25s ease;
}
.profile-modal-overlay.open{display:flex;opacity:1;}
.profile-modal{
  background:var(--bg-1);
  color:var(--text);
  max-width:640px;width:100%;
  max-height:88vh;
  overflow-y:auto;
  border-radius:8px;
  display:grid;
  grid-template-columns:220px 1fr;
  position:relative;
  box-shadow:0 30px 70px rgba(0,0,0,.4);
  transform:translateY(14px) scale(.98);
  transition:transform .25s ease;
}
.profile-modal-overlay.open .profile-modal{transform:translateY(0) scale(1);}
.modal-photo{width:100%;height:100%;min-height:220px;}
.modal-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;}
.modal-info{padding:28px 26px;display:flex;flex-direction:column;gap:10px;}
.modal-info h3{font-size:20px;text-transform:none;letter-spacing:0;}
.modal-role{color:var(--accent-deep);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;}
.modal-bio{font-size:14px;line-height:1.6;color:var(--muted);font-weight:400;text-transform:none;margin:6px 0 4px;}
.modal-info .btn{align-self:flex-start;margin-top:4px;}
.modal-close{
  position:absolute;top:12px;right:12px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(20,18,15,.55);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;line-height:1;z-index:3;
  transition:background .2s;
}
.modal-close:hover{background:var(--accent);}

/* ---------- AUTH MODAL (вход / регистрация) ---------- */
.auth-modal-overlay{
  position:fixed;inset:0;z-index:1100;
  background:rgba(20,18,15,.72);
  backdrop-filter:blur(6px);
  display:none;
  align-items:center;justify-content:center;
  padding:24px;
  opacity:0;
  transition:opacity .25s ease;
}
.auth-modal-overlay.open{display:flex;opacity:1;}
.auth-modal{
  background:var(--bg-1);
  color:var(--text);
  width:100%;max-width:400px;
  border-radius:8px;
  position:relative;
  padding:32px 28px 28px;
  box-shadow:0 30px 70px rgba(0,0,0,.4);
  transform:translateY(14px) scale(.98);
  transition:transform .25s ease;
}
.auth-modal-overlay.open .auth-modal{transform:translateY(0) scale(1);}
.auth-tabs{display:flex;gap:4px;background:var(--bg-2);border-radius:24px;padding:4px;margin-bottom:24px;}
.auth-tab{flex:1;padding:10px 12px;border-radius:20px;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);transition:background .2s,color .2s;}
.auth-tab.active{background:var(--accent);color:var(--paper);}
.auth-step h3{font-size:20px;text-transform:none;letter-spacing:0;margin-bottom:8px;}
.auth-hint{font-size:13.5px;line-height:1.55;color:var(--muted);font-weight:400;text-transform:none;margin-bottom:18px;}
.auth-hint a{color:var(--accent-deep);font-weight:600;text-decoration:underline;}
.auth-field{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:6px;padding:0 14px;margin-bottom:6px;transition:border-color .2s;}
.auth-field:focus-within{border-color:var(--accent);}
.auth-prefix{font-weight:700;font-size:15px;color:var(--muted);flex:0 0 auto;}
.auth-field input{flex:1;border:none;background:none;padding:14px 0;font-size:15px;color:var(--text);font-family:inherit;}
.auth-field input:focus{outline:none;}
.auth-code-field input{letter-spacing:.4em;font-size:20px;text-align:center;font-weight:700;}
.auth-error{min-height:18px;font-size:12.5px;color:#c9432e;margin-bottom:10px;font-weight:500;}
.auth-submit{width:100%;justify-content:center;margin-top:6px;}
.auth-submit:disabled{opacity:.65;cursor:default;}
.auth-bot-link{text-decoration:none;margin-bottom:6px;}
.auth-resend{display:block;width:100%;text-align:center;margin-top:14px;font-size:12.5px;font-weight:600;color:var(--accent-deep);text-decoration:underline;}
.auth-resend:disabled{color:var(--muted);text-decoration:none;cursor:default;}
.auth-step[data-auth-step="success"]{text-align:center;padding:12px 0 4px;}
.auth-success-icon{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--paper);font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
.auth-step[data-auth-step="success"] .auth-hint{margin-bottom:0;}

/* ---------- ORDER MODAL (разместить заказ — доступно без регистрации) ---------- */
.order-modal-overlay{
  position:fixed;inset:0;z-index:1100;
  background:rgba(20,18,15,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;
  align-items:center;justify-content:center;
  padding:24px;
  opacity:0;
  transition:opacity .25s ease;
}
.order-modal-overlay.open{display:flex;opacity:1;}
.order-modal{
  background:var(--bg-1);
  color:var(--text);
  width:100%;max-width:480px;
  max-height:90vh;overflow-y:auto;
  border-radius:8px;
  position:relative;
  padding:32px 28px 28px;
  box-shadow:0 30px 70px rgba(0,0,0,.4);
  transform:translateY(14px) scale(.98);
  transition:transform .25s ease;
}
.order-modal-overlay.open .order-modal{transform:translateY(0) scale(1);}
.order-modal h3{font-size:20px;text-transform:none;letter-spacing:0;margin-bottom:6px;}
.order-modal .auth-hint{margin-bottom:20px;}
.order-field{margin-bottom:16px;}
.order-field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:7px;}
.order-field input,.order-field select,.order-field textarea{
  width:100%;border:1.5px solid var(--line);border-radius:6px;
  padding:12px 14px;font-size:14.5px;color:var(--text);font-family:inherit;
  background:var(--bg-1);transition:border-color .2s;
}
.order-field input:focus,.order-field select:focus,.order-field textarea:focus{outline:none;border-color:var(--accent);}
.order-field textarea{min-height:96px;resize:vertical;}
.order-field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.order-modal .auth-error{min-height:18px;font-size:12.5px;color:#c9432e;margin-bottom:6px;font-weight:500;}
.order-modal .auth-submit{width:100%;justify-content:center;margin-top:6px;}
.order-guest-note{font-size:12.5px;line-height:1.55;color:var(--muted);background:var(--bg-2);border-radius:6px;padding:12px 14px;margin-bottom:18px;font-weight:400;text-transform:none;}

@media(max-width:480px){
  .order-modal-overlay{padding:12px;}
  .order-modal{padding:22px 18px 20px;max-width:100%;}
  .order-field-row{grid-template-columns:1fr;gap:0;}
}

@media(max-width:480px){
  .profile-modal-overlay,.auth-modal-overlay{padding:12px;}
  .auth-modal{padding:24px 18px 20px;max-width:100%;}
  .auth-tabs{margin-bottom:18px;}
  .auth-step h3{font-size:17px;}
  .auth-hint{font-size:12.5px;margin-bottom:14px;}
  .auth-field{padding:0 10px;}
  .auth-prefix{font-size:14px;}
  .auth-field input{padding:12px 0;font-size:14px;}
  .auth-code-field input{letter-spacing:.28em;font-size:18px;}
  .auth-success-icon{width:48px;height:48px;font-size:22px;margin-bottom:14px;}
}

.steps-block{margin-bottom:60px;}
.steps-block:last-child{margin-bottom:0;}
.steps-block .kicker{display:flex;align-items:baseline;gap:14px;margin-bottom:28px;}
.steps-block .kicker h3{font-size:22px;}
.steps-block .kicker span{color:var(--accent);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.step{border-top:3px solid var(--accent);padding-top:18px;}
.step .idx{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.06em;}
.step h4{font-weight:700;font-size:16px;text-transform:uppercase;margin:8px 0 10px;}
.step p{font-size:14px;line-height:1.55;color:var(--muted-alt);text-transform:none;font-weight:400;}

.testi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
.testi{
  position:relative;display:grid;grid-template-columns:104px 1fr;
  border-radius:10px;overflow:hidden;background:var(--bg-1);
  border:1px solid var(--line);
  opacity:0;transform:translateY(28px);
  transition:opacity .7s cubic-bezier(.2,.7,.3,1),transform .7s cubic-bezier(.2,.7,.3,1),box-shadow .3s,border-color .3s;
}
.testi.in-view{opacity:1;transform:translateY(0);}
.testi:hover{box-shadow:0 18px 40px rgba(20,18,15,.14);border-color:var(--accent);transform:translateY(-4px);}
.testi.in-view:hover{transform:translateY(-4px);}
.testi::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;

}
.testi img{width:100%;height:100%;object-fit:cover;filter:grayscale(20%);}
.testi .body{position:relative;padding:20px 22px 18px;display:flex;flex-direction:column;justify-content:center;}
.testi .body::before{content:"\201C";position:absolute;top:2px;right:14px;font-size:46px;line-height:1;font-weight:700;color:var(--accent);opacity:.18;font-family:Georgia,serif;}
.testi p{font-size:13.5px;line-height:1.55;margin-bottom:10px;font-weight:400;text-transform:none;color:var(--text);}
.testi .who{font-size:11.5px;color:var(--accent-deep);font-weight:700;letter-spacing:.04em;text-transform:uppercase;}

.faq{max-width:820px;margin:0 auto;}
.faq-item{border-bottom:1px solid var(--line-light);}
.faq-q{width:100%;text-align:left;padding:20px 4px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;color:var(--text-alt);}
.faq-q .plus{color:var(--accent);font-size:20px;font-weight:700;transition:transform .3s;}
.faq-item.open .plus{transform:rotate(45deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease;font-size:14px;color:var(--muted);line-height:1.6;font-weight:400;}
.faq-a p{padding:0 4px 20px;}

/* ---------- HUNTERS CTA (above footer) ---------- */
.hunters-cta{
  position:relative;overflow:hidden;text-align:center;
  padding:88px 0;
  background:radial-gradient(120% 160% at 50% 0%,rgba(240,172,60,.16),transparent 60%),var(--ink);
  color:var(--paper);
  border-top:1px solid var(--line-light);
}
.hunters-cta::before{
  content:"";position:absolute;inset:0;

  opacity:.5;pointer-events:none;
}
.hunters-cta .wrap{position:relative;}
.hunters-cta h2{font-size:clamp(26px,3.6vw,42px);max-width:680px;margin:0 auto 34px;line-height:1.15;}
.btn-bounce{animation:btnBounce 1.8s ease-in-out infinite;}
@keyframes btnBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.btn-bounce:hover{animation-play-state:paused;}

footer{padding:56px 0 32px;}
.footer-top{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:32px;margin-bottom:40px;}
.footer-top .logo{color:var(--text-alt);margin-bottom:14px;}
.footer-top p{font-size:13px;color:var(--muted-alt);max-width:240px;line-height:1.55;font-weight:400;text-transform:none;}
.footer-since{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);}
.footer-col h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:14px;font-weight:700;}
.footer-col a{display:block;font-size:13px;color:var(--muted-alt);padding:5px 0;transition:color .2s;font-weight:400;}
.footer-col a:hover{color:var(--accent);}
.footer-bottom{border-top:1px solid var(--line-light);padding-top:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.footer-bottom .mono{font-size:11px;color:var(--muted-alt);font-weight:500;}
.social{display:flex;gap:10px;}
.social a{width:36px;height:36px;border:1px solid var(--line-light);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-alt);transition:background .2s,border-color .2s,color .2s,transform .2s;}
.social a svg{width:16px;height:16px;fill:currentColor;}
.social a:hover{background:var(--accent);border-color:var(--accent);color:var(--paper);transform:translateY(-2px);}

@media(max-width:480px){
  .hunters-cta{padding:56px 0;}
  .hunters-cta h2{font-size:24px;margin-bottom:24px;}
}

@media(max-width:1115px){
  /* На узких экранах для 7 пунктов меню места мало даже с горизонтальным
     скроллом (см. основное правило nav.main-nav выше) — постоянно

/* ---------- PREMIUM DEV SPOTLIGHT ---------- */
.dev-spotlight{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:34px;align-items:center;}
.dev-spotlight .premium-card{aspect-ratio:1/1.15;border:none;border-radius:8px;}

/* анимированная золотая рамка + свечение */
.premium-card{
  position:relative;isolation:isolate;
  box-shadow:0 18px 44px rgba(240,172,60,.28);
  animation:premium-float 5s ease-in-out infinite;
}
.premium-card::before{
  content:"";position:absolute;inset:-2px;z-index:-1;border-radius:10px;
  background:conic-gradient(from 0deg,var(--accent),#ffe6a8,var(--accent-2),var(--accent),#fff1cf,var(--accent));
  animation:premium-spin 6s linear infinite;
}
.premium-card::after{
  content:"";position:absolute;inset:-14px;z-index:-2;border-radius:18px;
  background:radial-gradient(closest-side,rgba(240,172,60,.45),transparent 70%);
  animation:premium-pulse 2.8s ease-in-out infinite;
}
@keyframes premium-spin{to{transform:rotate(360deg);}}
@keyframes premium-pulse{0%,100%{opacity:.35;transform:scale(.96);}50%{opacity:.8;transform:scale(1.04);}}
@keyframes premium-float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

.premium-card img{filter:grayscale(0%);}
.premium-card:hover img{transform:scale(1.07);}

/* блик, пробегающий по карточке */
.premium-shine{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;border-radius:8px;}
.premium-shine::before{
  content:"";position:absolute;top:-60%;left:-70%;width:45%;height:220%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  transform:rotate(22deg);animation:premium-shine 3.6s ease-in-out infinite;
}
@keyframes premium-shine{0%{left:-70%;}55%,100%{left:130%;}}

/* плашка PREMIUM */
.premium-ribbon{
  position:absolute;top:12px;left:12px;z-index:4;
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:#2b1a02;background:linear-gradient(135deg,#ffd77a,var(--accent),#ffe9b5);
  padding:6px 11px;border-radius:20px;
  box-shadow:0 6px 16px rgba(240,172,60,.5);
  animation:ribbon-pop 2.4s ease-in-out infinite;
}
.premium-ribbon::before{content:"👑";font-size:11px;}
@keyframes ribbon-pop{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}

.premium-card .overlay .who{display:flex;align-items:center;gap:6px;opacity:1;}
.premium-card .verified{
  width:15px;height:15px;border-radius:50%;background:var(--accent);
  color:#2b1a02;font-size:9px;display:inline-flex;align-items:center;justify-content:center;
}

/* правая панель */
.dev-panel .eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;}
.dev-panel h3{font-size:clamp(22px,2.6vw,32px);line-height:1.2;margin-bottom:14px;}
.dev-panel p{color:var(--muted);font-size:15px;line-height:1.65;margin-bottom:18px;max-width:640px;}
.dev-list{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 18px;margin-bottom:24px;}
.dev-list li{position:relative;padding-left:24px;font-size:14px;color:var(--text);opacity:.9;}
.dev-list li::before{content:"";position:absolute;left:0;top:7px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(240,172,60,.18);}
.dev-actions{display:flex;flex-wrap:wrap;gap:12px;}
.btn-glow{position:relative;overflow:hidden;animation:btn-glow 2.6s ease-in-out infinite;}
.btn-glow::after{
  content:"";position:absolute;top:0;left:-80%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  transform:skewX(-20deg);animation:premium-shine 3s ease-in-out infinite;
}
@keyframes btn-glow{0%,100%{box-shadow:0 0 0 0 rgba(240,172,60,.45);}50%{box-shadow:0 0 0 12px rgba(240,172,60,0);}}

@media(max-width:900px){
  .dev-spotlight{grid-template-columns:1fr;gap:24px;}
  .dev-spotlight .premium-card{max-width:300px;margin:0 auto;width:100%;}
  .dev-list{grid-template-columns:1fr;}
}
@media(prefers-reduced-motion:reduce){
  .premium-card,.premium-card::before,.premium-card::after,.premium-shine::before,.premium-ribbon,.btn-glow,.btn-glow::after{animation:none!important;}
}

/* ---------- КНОПКА «ЗАЯВКИ» В ШАПКЕ (привлечение внимания) ---------- */
.orders-cta-wrap{position:relative;display:inline-flex;}
.btn-orders{position:relative;gap:8px;animation:orders-ring 2.2s ease-out infinite;overflow:hidden;}
.btn-orders::after{
  content:"";position:absolute;top:0;left:-80%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-20deg);animation:premium-shine 3s ease-in-out infinite;
}
.orders-live{position:relative;width:8px;height:8px;border-radius:50%;background:#2fd36b;flex:0 0 auto;box-shadow:0 0 0 0 rgba(47,211,107,.7);animation:orders-live 1.6s ease-out infinite;}
.orders-arrow{width:14px;height:14px;flex:0 0 auto;animation:orders-nudge 1.2s ease-in-out infinite;}
@keyframes orders-ring{0%{box-shadow:0 0 0 0 rgba(240,172,60,.6);}70%,100%{box-shadow:0 0 0 14px rgba(240,172,60,0);}}
@keyframes orders-live{0%{box-shadow:0 0 0 0 rgba(47,211,107,.7);}70%,100%{box-shadow:0 0 0 7px rgba(47,211,107,0);}}
@keyframes orders-nudge{0%,100%{transform:translateX(0);}50%{transform:translateX(4px);}}

.orders-hint{
  position:absolute;top:calc(100% + 12px);right:0;z-index:5;
  display:flex;align-items:center;gap:8px;white-space:nowrap;
  background:var(--ink);color:var(--paper);font-size:12px;font-weight:600;
  padding:9px 14px;border-radius:8px;border:1px solid var(--accent);
  box-shadow:0 10px 26px rgba(0,0,0,.28);pointer-events:none;
  opacity:0;animation:orders-hint-in .5s ease 1.2s forwards, orders-hint-bob 2s ease-in-out 1.7s infinite;
}
.orders-hint::before{content:"";position:absolute;top:-6px;right:26px;width:10px;height:10px;background:var(--ink);border-left:1px solid var(--accent);border-top:1px solid var(--accent);transform:rotate(45deg);}
.orders-hint-pointer{display:inline-block;animation:orders-poke 1.2s ease-in-out infinite;}
.orders-cta-wrap:hover .orders-hint,.orders-cta-wrap.is-calm .orders-hint{display:none;}
.orders-cta-wrap.is-calm .btn-orders{animation:none;}
@keyframes orders-hint-in{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
@keyframes orders-hint-bob{0%,100%{transform:translateY(0);}50%{transform:translateY(4px);}}
@keyframes orders-poke{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}

@media(max-width:480px){
  .header-actions .btn-orders{padding:8px 10px;font-size:10px;gap:5px;}
  .orders-arrow{display:none;}
  .orders-live{width:6px;height:6px;}
  .orders-hint{font-size:10.5px;padding:7px 10px;right:-4px;}
  .orders-hint::before{right:30px;}
}

/* ---------- РЕКЛАМНЫЙ СЛОТ «ЗДЕСЬ МОГЛА БЫ БЫТЬ ВАША РЕКЛАМА» ---------- */
.ad-slot{
  position:relative;isolation:isolate;overflow:hidden;
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:28px;
  margin-top:56px;padding:38px 40px;border-radius:14px;
  background:linear-gradient(135deg,#1a1308 0%,#2a1d0b 55%,#1a1308 100%);
  color:var(--paper);cursor:pointer;
  transition:transform .3s ease,box-shadow .3s ease;
}
/* бегущая золотая пунктирная рамка */
.ad-slot::before{
  content:"";position:absolute;inset:0;border-radius:14px;padding:2px;z-index:-1;
  background:conic-gradient(from var(--ad-angle,0deg),transparent 0 55%,var(--accent) 75%,#fff2c9 85%,transparent 100%);

.hn-fab{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; min-width:44px; padding:0 14px; border-radius:99px; cursor:pointer; font-family:inherit; font-size:12px;
  color:var(--text, inherit); background:var(--card, var(--bg-1, #fff)); border:1px solid var(--border, var(--line, rgba(128,128,128,.4))); box-shadow:0 8px 24px rgba(0,0,0,.28); transition:transform .15s, border-color .15s;}
.hn-fab:hover{transform:translateY(-2px); border-color:var(--accent, #f0ac3c);}
.hn-fab:focus-visible{outline:2px solid var(--accent, #f0ac3c); outline-offset:2px;}
.hn-fab[hidden]{display:none;}
.hn-fab kbd{font:600 11px/1 ui-monospace, monospace; opacity:.6; border:1px solid currentColor; border-radius:5px; padding:3px 5px;}
.hn-fab-top{padding:0; width:44px;}

.hn-pal{position:fixed; inset:0; z-index:2147482000; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); display:flex; align-items:flex-start; justify-content:center; padding:12vh 12px 12px;}
.hn-pal[hidden]{display:none;}
.hn-pal-box{width:min(620px,100%); max-height:72vh; display:flex; flex-direction:column; border-radius:16px; overflow:hidden;
  background:var(--bg-elevated, var(--card, var(--bg-1, #fff))); color:var(--text, inherit); border:1px solid var(--border, var(--line, rgba(128,128,128,.4))); box-shadow:0 30px 90px rgba(0,0,0,.5);}
.hn-pal-in{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border, var(--line, rgba(128,128,128,.3))); color:var(--text-dim, var(--muted, #888));}
.hn-pal-in input{flex:1; min-width:0; border:0 !important; outline:0; background:transparent !important; color:var(--text, inherit); font-size:16px; font-family:inherit; padding:2px 0 !important; box-shadow:none !important; width:auto !important;}
.hn-esc{font:600 11px/1 ui-monospace, monospace; border:1px solid currentColor; border-radius:5px; padding:3px 6px; opacity:.6;}
.hn-pal-list{overflow-y:auto; padding:6px; overscroll-behavior:contain;}
.hn-sec{padding:10px 10px 4px; font-size:12px; font-weight:600; color:var(--accent, #f0ac3c);}
.hn-row{display:flex; align-items:center; gap:12px; padding:10px; border-radius:10px; cursor:pointer; font-size:14px;}
.hn-row.act{background:var(--card-hover, rgba(128,128,128,.14));}
.hn-name{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1;}
.hn-name small{font-size:11.5px; color:var(--text-dim, var(--muted, #888));}
.hn-chips{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
.hn-chip{font-size:12px; padding:5px 10px; border-radius:99px; border:1px solid var(--border, var(--line, rgba(128,128,128,.4))); color:var(--text-dim, inherit); text-decoration:none; white-space:nowrap;}
.hn-chip.main,.hn-chip:hover{border-color:var(--accent, #f0ac3c); color:var(--accent, #f0ac3c);}
.hn-empty{padding:28px 14px; text-align:center; color:var(--text-dim, var(--muted, #888)); font-size:14px;}
.hn-foot{padding:8px 12px 4px; font-size:11.5px; color:var(--text-dim, var(--muted, #888)); text-align:right;}
html.hn-lock{overflow:hidden;}

/* скелетоны загрузки */
.hn-skel{border-radius:12px; border:1px solid var(--border, var(--line, rgba(128,128,128,.25))); background:var(--card, transparent); padding:16px; display:flex; flex-direction:column; gap:10px; margin-bottom:10px;}
.hn-skel i{display:block; height:12px; border-radius:6px; background:linear-gradient(90deg, rgba(128,128,128,.14) 25%, rgba(128,128,128,.26) 50%, rgba(128,128,128,.14) 75%); background-size:200% 100%; animation:hnShimmer 1.2s linear infinite;}
.hn-skel i:nth-child(1){width:55%; height:16px;} .hn-skel i:nth-child(2){width:90%;} .hn-skel i:nth-child(3){width:35%;}
@keyframes hnShimmer{to{background-position:-200% 0;}}
@media (prefers-reduced-motion: reduce){ .hn-skel i{animation:none;} .hn-fab{transition:none;} }

/* пустые состояния списков */
.hn-emptybox{padding:36px 18px; text-align:center; color:var(--text-dim, var(--muted, #888)); font-size:14px; display:flex; flex-direction:column; align-items:center; gap:12px;}
.hn-emptybox b{color:var(--text, inherit); font-size:15px;}
.hn-emptybox button{border:1px solid var(--accent, #f0ac3c); background:transparent; color:var(--accent, #f0ac3c); padding:8px 16px; border-radius:99px; cursor:pointer; font-family:inherit; font-size:13px;}
.hn-emptybox button:hover{background:var(--accent, #f0ac3c); color:var(--on-accent, #111);}


.hn-reset{margin-top:12px; border:1px solid var(--accent, #f0ac3c); background:transparent; color:var(--accent, #f0ac3c); padding:9px 18px; border-radius:99px; cursor:pointer; font-family:inherit; font-size:13px;}
.hn-reset:hover{background:var(--accent, #f0ac3c); color:var(--on-accent, #111);}

@media (max-width:820px){
  .hn-bar{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:950; padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    background:var(--bg-elevated, var(--card, var(--bg-1, #fff))); border-top:1px solid var(--border, var(--line, rgba(128,128,128,.4))); backdrop-filter:blur(10px);}
  .hn-tab{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; border:0; background:transparent; color:var(--text-dim, var(--muted, #888)); font:inherit; font-size:11px; text-decoration:none; cursor:pointer; border-radius:10px;}
  .hn-tab span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hn-tab.on{color:var(--accent, #f0ac3c);}
  body.hn-has-bar{padding-bottom:calc(66px + env(safe-area-inset-bottom));}
  .hn-fabs{bottom:calc(78px + env(safe-area-inset-bottom)); right:12px;}
  .hn-fab-search{display:none;}
  .hn-pal{padding-top:6vh;}
  .hn-row.hn-cat{flex-direction:column; align-items:flex-start; gap:8px;}
  .hn-chips{justify-content:flex-start;}
  .hn-esc{display:none;}
}

/* Текст для роботов: невидим на экране, но есть в HTML; на странице заявки (data-keep) — обычный блок */
.seo-static{position:absolute; left:-99999px; top:0; width:1px; height:1px; overflow:hidden;}
.seo-static[data-keep]{position:static; width:auto; height:auto; overflow:visible; max-width:760px; margin:48px auto; padding:0 18px; color:var(--text, inherit);}
.seo-static[data-keep] h1{font-size:clamp(24px,4vw,34px); line-height:1.2; margin:10px 0 14px;}
.seo-static[data-keep] p{line-height:1.6;}
.seo-crumb{font-size:13px; opacity:.7;} .seo-crumb a{color:inherit;}
.seo-budget{font-weight:700; color:var(--accent, #f0ac3c);}
.seo-static[data-keep] p{margin:0 0 16px;}
.seo-static[data-keep] .btn{display:inline-block; margin-top:6px;}

/* подписки на заявки (alerts.js) */
.al-card{display:flex; align-items:center; gap:14px; padding:14px 16px; margin:0 0 18px; border-radius:14px; scroll-margin-top:80px;
  border:1px solid var(--border, var(--line, rgba(128,128,128,.35))); background:var(--card, var(--bg-1, transparent));}
.al-ic{flex:0 0 auto; width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--accent, #f0ac3c);
  background:color-mix(in srgb, var(--accent, #f0ac3c) 14%, transparent);}
.al-tx{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; font-size:13px; color:var(--text-dim, var(--muted, #888));}
.al-tx b{color:var(--text, inherit); font-size:14.5px;}
.al-tx small{font-size:12px; color:var(--accent, #f0ac3c);}
.al-btn{border:0; cursor:pointer; padding:10px 16px; border-radius:10px; font:600 13px/1 inherit; font-family:inherit; white-space:nowrap;
  background:var(--accent, #f0ac3c); color:var(--on-accent, #111);}
.al-btn:hover{filter:brightness(1.08);} .al-btn:focus-visible{outline:2px solid var(--accent, #f0ac3c); outline-offset:2px;}
.al-btn.ghost{background:transparent; color:var(--text, inherit); border:1px solid var(--border, var(--line, rgba(128,128,128,.4)));}
.al-bell{display:inline-flex; align-items:center; gap:8px; margin-left:auto; padding:7px 14px; border-radius:99px; cursor:pointer; font:inherit; font-size:12.5px;
  border:1px solid var(--border, var(--line, rgba(128,128,128,.4))); background:transparent; color:var(--text-dim, inherit);}
.al-bell:hover{border-color:var(--accent, #f0ac3c); color:var(--accent, #f0ac3c);}
.al-bell.on{border-color:var(--accent, #f0ac3c); color:var(--on-accent, #111); background:var(--accent, #f0ac3c);}
.al-ov{position:fixed; inset:0; z-index:2147481000; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:14px;}
.al-ov[hidden]{display:none;}
.al-box{width:min(520px,100%); max-height:88vh; overflow:auto; border-radius:16px; background:var(--bg-elevated, var(--card, var(--bg-1, #fff))); color:var(--text, inherit);
  border:1px solid var(--border, var(--line, rgba(128,128,128,.4))); box-shadow:0 30px 90px rgba(0,0,0,.5);}
.al-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border, var(--line, rgba(128,128,128,.3)));}
.al-head span{display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px;}
.al-x{border:0; background:transparent; color:inherit; font-size:24px; line-height:1; cursor:pointer; padding:0 4px; opacity:.7;}
.al-body{padding:18px; display:flex; flex-direction:column; gap:14px; font-size:14px; line-height:1.5;}
.al-body h3{margin:0; font-size:16px;} .al-body p{margin:0; color:var(--text-dim, var(--muted, #888));}
.al-row{display:flex; gap:10px; flex-wrap:wrap;}
.al-speed{font-size:12.5px;}
.al-add{display:flex; gap:10px; align-items:stretch;} .al-add .cp,.al-add select{flex:1; min-width:0;}
.al-mine b{font-size:13px;}
.al-chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.al-chip{display:inline-flex; align-items:center; gap:6px; padding:6px 6px 6px 12px; border-radius:99px; font-size:13px; border:1px solid var(--border, var(--line, rgba(128,128,128,.4)));}
.al-chip button{border:0; width:20px; height:20px; border-radius:50%; cursor:pointer; background:rgba(128,128,128,.22); color:inherit; line-height:1; font-size:15px;}
.al-chip button:hover{background:var(--accent, #f0ac3c); color:var(--on-accent, #111);}
.al-none{margin-top:6px !important;}
.al-msg{min-height:1.2em; font-size:12.5px; color:var(--accent, #f0ac3c) !important;}
.al-toast{position:fixed; left:50%; bottom:calc(88px + env(safe-area-inset-bottom)); transform:translate(-50%,12px); opacity:0; pointer-events:none; z-index:2147481500; padding:10px 16px; border-radius:99px;
  background:var(--bg-elevated, #222); color:var(--text, #fff); border:1px solid var(--border, rgba(128,128,128,.4)); font-size:13px; transition:opacity .2s, transform .2s;}
.al-toast.on{opacity:1; transform:translate(-50%,0);}
@media (max-width:560px){ .al-card{flex-wrap:wrap;} .al-btn{width:100%;} .al-bell{margin-left:0; margin-top:8px;} .al-add{flex-direction:column;} }
@media (prefers-reduced-motion: reduce){ .al-toast{transition:none;} }
