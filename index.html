<script>
/* Слайдер баннеров-спонсоров — общий скрипт для index.html, cabinet.html
   и freelancers.html. Смена слайда каждые 10 секунд, клик по баннеру
   ведёт по ссылке из BANNER_LINKS. Поменяй адреса здесь — они применятся
   сразу ко всем слайдерам на всех страницах.

   Поведение при взаимодействии:
   - наведение курсора (десктоп) или касание (мобильный) ставит ротацию на
     паузу, чтобы баннер не "убегал" из-под пальца/курсора, пока человек
     его читает;
   - клик по баннеру замирает на текущем слайде (ротация останавливается
     совсем) — так пользователь не видит, как слайд меняется у него под
     носом в момент перехода по ссылке. */
const BANNER_LINKS = {
  1: 'https://businessconsult.uz',
  2: 'https://gilamchi-oka.github.io/Gilam-Yuvish-Toshkent/',
};

const BANNER_ROTATE_MS = 10000;

(function initBannerSliders(){
  function start(){
    document.querySelectorAll('[data-banner-slider]').forEach(slider=>{
      const slides = Array.from(slider.querySelectorAll('.banner-slide'));
      if (slides.length < 1) return;

      slides.forEach(slide=>{
        const key = slide.dataset.bannerLink;
        if (key && BANNER_LINKS[key]) slide.href = BANNER_LINKS[key];
      });

      if (slides.length < 2) return;
      let current = slides.findIndex(s=>s.classList.contains('is-active'));
      if (current < 0) current = 0;

      let timer = null;
      let frozen = false;

      function next(){
        slides[current].classList.remove('is-active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('is-active');
      }
      function play(){
        if (frozen || timer) return;
        timer = setInterval(next, BANNER_ROTATE_MS);
      }
      function pause(){
        if (timer){ clearInterval(timer); timer = null; }
      }
      function freeze(){
        frozen = true;
        pause();
      }

      slider.addEventListener('mouseenter', pause);
      slider.addEventListener('mouseleave', ()=>{ if(!frozen) play(); });
      slider.addEventListener('touchstart', pause, {passive:true});
      slides.forEach(slide=> slide.addEventListener('click', freeze));

      play();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();

</script>
<script>
/* Общие утилиты фронтенда Hunta: конфиг, вход через Google, категории, привязка Telegram,
   плашка «заявки с задержкой». Подключается ПЕРЕД script.js / cabinet.js / freelancers.js / vacancies.js. */
(function () {
  const API = '/api';
  const H = (window.Hunta = window.Hunta || {});

  /* ---------- конфиг ---------- */
  let _cfg = null;
  H.config = function () {
    if (!_cfg) {
      _cfg = fetch(`${API}/config`, { credentials: 'include' })
        .then(r => (r.ok ? r.json() : {}))
        .catch(() => ({}));
    }
    return _cfg;
  };

  /* ---------- категории (единый источник — /api/categories) ---------- */
  let _cats = null;
  H.categories = function () {
    if (!_cats) {
      _cats = fetch(`${API}/categories`)
        .then(r => (r.ok ? r.json() : null))
        .then(d => {
          // API: {groups:[{key,ru,uz}], categories:[{key,group,ru,uz,tg}]} -> группы с вложенными категориями
          const flat = (d && d.categories) || [];
          const groups = ((d && d.groups) || []).map(g => ({
            ...g, categories: flat.filter(c => c.group === g.key),
          })).filter(g => g.categories.length);
          return { groups, flat };
        })
        .catch(() => ({ groups: [], flat: [] }));
    }
    return _cats;
  };

  /* Заполняет <select> категориями, сгруппированными через <optgroup>. */
  H.fillCategorySelect = async function (sel, lang, placeholder) {
    if (!sel) return;
    const { groups } = await H.categories();
    sel.innerHTML = '';
    if (placeholder != null) {
      const ph = document.createElement('option');
      ph.value = ''; ph.disabled = true; ph.selected = true; ph.textContent = placeholder;
      sel.appendChild(ph);
    }
    groups.forEach(g => {
      const og = document.createElement('optgroup');
      og.label = lang === 'uz' ? (g.uz || g.ru) : g.ru;
      (g.categories || []).forEach(c => {
        const o = document.createElement('option');
        o.value = c.key;
        o.textContent = lang === 'uz' ? (c.uz || c.ru) : c.ru;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
  };

  /* ---------- язык страницы (cabinet/freelancers/vacancies: lang; index: currentLang) ---------- */
  H.curLang = function () {
    try { if (typeof lang !== 'undefined' && lang) return lang; } catch (e) {}
    try { if (typeof currentLang !== 'undefined' && currentLang) return currentLang; } catch (e) {}
    return document.documentElement.dataset.lang || 'ru';
  };

  /* ---------- поиск по категориям ---------- */
  const norm = s => (s || '').toLowerCase().replace(/ё/g, 'е').replace(/[’‘`ʻʼ']/g, "'")
    .replace(/[^a-z0-9а-я' ]+/g, ' ').replace(/\s+/g, ' ').trim();
  H.normText = norm;

  let _index = null;
  H.searchIndex = function () {
    if (!_index) {
      _index = H.categories().then(({ groups, flat }) => {
        const gname = {}; groups.forEach(g => { gname[g.key] = g; });
        const map = {};
        flat.forEach(c => {
          const g = gname[c.group] || {};
          map[c.key] = {
            c, g,
            names: { ru: norm(c.ru), uz: norm(c.uz), en: norm(c.en) },
            extra: norm([c.key, g.ru, g.uz, g.en, ...(c.kw || [])].join(' ')),
          };
        });
        return { map, groups, flat };
      });
    }
    return _index;
  };

  /* Оценка совпадения запроса с категорией; 0 — не подходит. Все слова запроса должны найтись. */
  H.scoreCategory = function (e, q, L) {
    if (!q) return 1;
    let total = 0;
    for (const tok of q.split(' ')) {
      if (!tok) continue;
      const main = e.names[L] || e.names.ru;
      let sc = 0;
      if (main.split(' ').some(w => w.startsWith(tok))) sc = 5;
      else if (main.includes(tok)) sc = 4;
      else if (e.names.ru.includes(tok) || e.names.uz.includes(tok) || e.names.en.includes(tok)) sc = 3;
      else if (e.extra.includes(tok)) sc = 2;
      if (!sc) return 0;
      total += sc;
    }
    return total;
  };

  const SEARCH_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
  const CHEV = '<svg class="cp-chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const CP_TEXT = {
    ru: { ph: 'Выберите категорию', search: 'Поиск: логотип, n8n, SMM, монтаж…', none: 'Ничего не найдено', other: 'Выбрать «Другое»', count: n => `Найдено: ${n}` },
    uz: { ph: 'Kategoriyani tanlang', search: 'Qidiruv: logotip, n8n, SMM, montaj…', none: 'Hech narsa topilmadi', other: '«Boshqa»ni tanlash', count: n => `Topildi: ${n}` },
    en: { ph: 'Choose a category', search: 'Search: logo, n8n, SMM, editing…', none: 'Nothing found', other: 'Choose “Other”', count: n => `Found: ${n}` },
  };

  /* Превращает обычный <select> с категориями в поиск-список. Остальной код продолжает читать/писать select.value. */
  H.enhanceCategorySelect = function (sel) {
    if (!sel || sel.dataset.cp) return;
    sel.dataset.cp = '1';
    const wrap = document.createElement('div');
    wrap.className = 'cp';
    wrap.innerHTML =
      `<button type="button" class="cp-btn" aria-haspopup="listbox" aria-expanded="false"><span class="cp-label"></span>${CHEV}</button>` +
      `<div class="cp-pop" hidden><div class="cp-search">${SEARCH_ICON}<input type="text" autocomplete="off" spellcheck="false" aria-label="Search"></div>` +
      `<div class="cp-meta" aria-live="polite"></div><div class="cp-list" role="listbox"></div></div>`;
    sel.parentNode.insertBefore(wrap, sel);
    sel.style.display = 'none';
    const btn = wrap.querySelector('.cp-btn'), label = wrap.querySelector('.cp-label');
    const pop = wrap.querySelector('.cp-pop'), input = wrap.querySelector('input');
    const meta = wrap.querySelector('.cp-meta'), list = wrap.querySelector('.cp-list');
    let items = [], active = -1;

    const T = () => CP_TEXT[H.curLang()] || CP_TEXT.ru;
    const optionKeys = () => Array.from(sel.options).filter(o => o.value).map(o => o.value);

    function refresh() {
      const o = sel.options[sel.selectedIndex];
      const has = o && o.value;
      label.textContent = has ? o.textContent : T().ph;
      btn.classList.toggle('cp-empty', !has);
    }
    // перехватываем программную установку select.value = '...'
    const desc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
    Object.defineProperty(sel, 'value', { configurable: true, get() { return desc.get.call(this); }, set(v) { desc.set.call(this, v); refresh(); } });
    new MutationObserver(refresh).observe(sel, { childList: true });
    sel.addEventListener('change', refresh);
    refresh();

    async function render() {
      const { map, groups } = await H.searchIndex();
      const L = H.curLang(), q = norm(input.value);
      const keys = optionKeys();
      const cur = sel.value;
      let rows = [];
      keys.forEach(k => { const e = map[k]; if (e) rows.push({ e, k, sc: H.scoreCategory(e, q, L) }); });
      rows = rows.filter(r => r.sc > 0);
      items = [];
      let html = '';
      if (q) {
        rows.sort((a, b) => b.sc - a.sc || (a.e.c[L] || a.e.c.ru).localeCompare(b.e.c[L] || b.e.c.ru));
        rows.forEach(r => items.push(r));
        html = rows.map((r, i) => itemHtml(r, i, L, cur, true)).join('');
        meta.textContent = rows.length ? T().count(rows.length) : '';
      } else {
        meta.textContent = '';
        groups.forEach(g => {
          const part = rows.filter(r => r.e.c.group === g.key);
          if (!part.length) return;
          html += `<div class="cp-group">${g[L] || g.ru}</div>`;
          part.forEach(r => { html += itemHtml(r, items.length, L, cur, false); items.push(r); });
        });
      }
      if (!rows.length) {
        html = `<div class="cp-none">${T().none}` +
          (keys.includes('other') ? `<button type="button" class="cp-other">${T().other}</button>` : '') + `</div>`;
      }
      list.innerHTML = html;
      active = items.findIndex(r => r.k === cur); if (active < 0) active = items.length ? 0 : -1;
      paintActive(!!q);
    }
    function itemHtml(r, i, L, cur, withGroup) {
      const c = r.e.c, g = r.e.g;
      return `<div class="cp-item${r.k === cur ? ' sel' : ''}" role="option" data-i="${i}">` +
        `<span class="cp-name">${c[L] || c.ru}</span>` +
        (withGroup ? `<span class="cp-grp">${(g && (g[L] || g.ru)) || ''}</span>` : '') + `</div>`;
    }
    function paintActive(scroll) {
      list.querySelectorAll('.cp-item').forEach(el => el.classList.toggle('act', +el.dataset.i === active));
      const el = list.querySelector('.cp-item.act');
      if (el && scroll !== false) el.scrollIntoView({ block: 'nearest' });
    }
    function place() {
      const r = btn.getBoundingClientRect();
      const below = window.innerHeight - r.bottom, above = r.top;
      const maxH = Math.min(360, Math.max(180, (below > 260 || below > above ? below : above) - 16));
      const w = Math.min(Math.max(r.width, 320), window.innerWidth - 16);
      pop.style.width = w + 'px'; pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
      list.style.maxHeight = (maxH - 56) + 'px';
      if (below >= 260 || below >= above) { pop.style.top = (r.bottom + 6) + 'px'; pop.style.bottom = 'auto'; }
      else { pop.style.bottom = (window.innerHeight - r.top + 6) + 'px'; pop.style.top = 'auto'; }
    }
    async function open() {
      input.placeholder = T().search; input.value = '';
      document.body.appendChild(pop); // вне transform-контейнеров (модалок), иначе fixed считается от них
      pop.hidden = false; btn.setAttribute('aria-expanded', 'true'); wrap.classList.add('open');
      place(); await render(); place();
      setTimeout(() => input.focus({ preventScroll: true }), 0);
      window.addEventListener('resize', place); window.addEventListener('scroll', onScroll, true);
      document.addEventListener('mousedown', onDoc, true);
    }
    function close(focusBtn) {
      pop.hidden = true; wrap.appendChild(pop); btn.setAttribute('aria-expanded', 'false'); wrap.classList.remove('open');
      window.removeEventListener('resize', place); window.removeEventListener('scroll', onScroll, true);
      document.removeEventListener('mousedown', onDoc, true);
      if (focusBtn) btn.focus({ preventScroll: true });
    }
    const onScroll = e => { if (!pop.contains(e.target)) place(); };
    const onDoc = e => { if (!wrap.contains(e.target) && !pop.contains(e.target)) close(false); };
    function choose(k) {
      sel.value = k;
      sel.dispatchEvent(new Event('change', { bubbles: true }));
      close(true);
    }

    btn.addEventListener('click', () => (pop.hidden ? open() : close(true)));
    input.addEventListener('input', () => render());
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); if (items.length) { active = (active + 1) % items.length; paintActive(); } }
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (items.length) { active = (active - 1 + items.length) % items.length; paintActive(); } }
      else if (e.key === 'Enter') { e.preventDefault(); if (items[active]) choose(items[active].k); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(true); }
      else if (e.key === 'Tab') close(false);
    });
    list.addEventListener('mousemove', e => {
      const el = e.target.closest('.cp-item'); if (el && +el.dataset.i !== active) { active = +el.dataset.i; paintActive(false); }
    });
    list.addEventListener('click', e => {
      const o = e.target.closest('.cp-other'); if (o) return choose('other');
      const el = e.target.closest('.cp-item'); if (el && items[+el.dataset.i]) choose(items[+el.dataset.i].k);
    });
    btn.addEventListener('keydown', e => { if (e.key === 'ArrowDown' && pop.hidden) { e.preventDefault(); open(); } });
  };

  /* ---------- поиск по списку категорий в сайдбаре ---------- */
  H.attachSidebarSearch = function (listEl) {
    if (!listEl || listEl.dataset.csearch) return;
    listEl.dataset.csearch = '1';
    const box = document.createElement('div');
    box.className = 'cat-search';
    box.innerHTML = `${SEARCH_ICON}<input type="search" autocomplete="off" spellcheck="false"><button type="button" class="cat-search-x" aria-label="Clear" hidden>×</button>`;
    listEl.parentNode.insertBefore(box, listEl);
    const input = box.querySelector('input'), clear = box.querySelector('.cat-search-x');
    const text = () => (CP_TEXT[H.curLang()] || CP_TEXT.ru).search;
    input.placeholder = text();
    let idx = null;
    H.searchIndex().then(i => { idx = i; apply(); });
    function apply() {
      const q = norm(input.value), L = H.curLang();
      input.placeholder = text();
      clear.hidden = !q;
      listEl.classList.toggle('searching', !!q);
      let any = false;
      listEl.querySelectorAll('.cat-group').forEach(gr => {
        let shown = 0;
        gr.querySelectorAll('.cat-item').forEach(it => {
          const k = it.dataset.key; const e = idx && k ? idx.map[k] : null;
          const ok = !q || (e ? H.scoreCategory(e, q, L) > 0 : norm(it.textContent).includes(q));
          it.style.display = ok ? '' : 'none'; if (ok) shown++;
        });
        gr.style.display = shown ? '' : 'none'; if (shown) any = true;
      });
      const first = listEl.querySelector(':scope > .cat-item');   // «Все категории»
      if (first) first.style.display = q ? 'none' : '';
      let empty = listEl.querySelector('.cat-empty');
      if (q && !any) {
        if (!empty) { empty = document.createElement('div'); empty.className = 'cat-empty'; listEl.appendChild(empty); }
        empty.textContent = (CP_TEXT[L] || CP_TEXT.ru).none;
      } else if (empty) empty.remove();
    }
    input.addEventListener('input', apply);
    clear.addEventListener('click', () => { input.value = ''; apply(); input.focus(); });
    // страницы перерисовывают список при каждой смене фильтра/языка — применяем поиск заново
    new MutationObserver(() => { if (input.value) apply(); }).observe(listEl, { childList: true });
  };

  /* ---------- вход через Google (Google Identity Services) ---------- */
  let _gsiLoaded = null;
  function loadGsi() {
    if (_gsiLoaded) return _gsiLoaded;
    _gsiLoaded = new Promise((resolve, reject) => {
      if (window.google && window.google.accounts) return resolve();
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true; s.defer = true;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('gsi_load_failed'));
      document.head.appendChild(s);
    });
    return _gsiLoaded;
  }

  /* Рисует кнопку «Войти через Google» в контейнере el.
     onDone(user) вызывается после успешного входа; onError(code) — при ошибке. */
  H.renderGoogleButton = async function (el, onDone, onError) {
    if (!el) return;
    const cfg = await H.config();
    if (!cfg.google_client_id) { el.hidden = true; return; }   // Google не настроен — прячем
    try { await loadGsi(); } catch (e) { el.hidden = true; return; }
    el.hidden = false;
    google.accounts.id.initialize({
      client_id: cfg.google_client_id,
      callback: async (resp) => {
        try {
          const r = await fetch(`${API}/auth/google`, {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential: resp.credential }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(data.error || 'google_failed');
          onDone && onDone(data);
        } catch (e) { onError && onError(e.message); }
      },
    });
    el.innerHTML = '';
    google.accounts.id.renderButton(el, {
      theme: 'outline', size: 'large', text: 'continue_with', shape: 'pill',
      width: Math.min(320, Math.max(220, (el.clientWidth || 300))),
    });
  };

  /* ---------- привязка Telegram для Google-аккаунтов ---------- */
  H.linkTelegram = async function () {
    const r = await fetch(`${API}/auth/telegram-link`, { method: 'POST', credentials: 'include' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'link_failed');
    window.open(d.url, '_blank', 'noopener');
    return d;
  };

  /* ---------- время: всё показываем в Ташкенте (UTC+5), независимо от пояса браузера ----------
     Сервер отдаёт ISO с «Z» (UTC). < 1 ч — «N мин назад»; < 24 ч — «N ч назад»;
     вчера — «вчера, 14:05»; дальше — «18.10.2026, 14:05». Метки «из будущего» (рассинхрон часов) = «только что». */
  const TZ = 'Asia/Tashkent';
  function tkParts(d){
    const f = new Intl.DateTimeFormat('ru-RU', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false });
    const o = {}; f.formatToParts(d).forEach(p => { o[p.type] = p.value; });
    return o;
  }
  H.formatDateTime = function (iso) {
    const d = new Date(iso); if (isNaN(d)) return '';
    const o = tkParts(d);
    return `${o.day}.${o.month}.${o.year}, ${o.hour}:${o.minute}`;
  };
  /* Поправка к часам устройства: server_time из /api/config минус локальное время (с учётом половины задержки). */
  let clockOffset = 0;
  H.now = () => Date.now() + clockOffset;
  H.syncClock = async function () {
    try {
      const t0 = Date.now();
      const c = await fetch(`${API}/config`, { credentials: 'include', cache: 'no-store' }).then(r => (r.ok ? r.json() : {}));
      const t1 = Date.now();
      const srv = c && c.server_time ? new Date(c.server_time).getTime() : NaN;
      if (!isNaN(srv)) { clockOffset = srv - (t0 + (t1 - t0) / 2); H.refreshAgo(); }
    } catch (e) { /* без поправки — используем часы устройства */ }
  };

  H.timeAgo = function (iso, lang) {
    const d = new Date(iso); if (isNaN(d)) return '';
    const ru = lang !== 'uz';
    const diffMin = Math.floor((H.now() - d.getTime()) / 60000);
    if (diffMin < 1) return ru ? 'только что' : 'hozirgina';
    if (diffMin < 60) return ru ? `${diffMin} мин назад` : `${diffMin} daqiqa oldin`;
    const hours = Math.floor(diffMin / 60);
    if (hours < 24) return ru ? `${hours} ч назад` : `${hours} soat oldin`;
    const t = tkParts(d), n = tkParts(new Date(H.now()));
    const dayNum = o => Date.UTC(+o.year, +o.month - 1, +o.day);
    const daysAgo = Math.round((dayNum(n) - dayNum(t)) / 86400000);
    if (daysAgo === 1) return (ru ? 'вчера, ' : 'kecha, ') + `${t.hour}:${t.minute}`;
    return H.formatDateTime(iso);
  };

  /* Для списков и карточек: «5 мин назад · 14:05» (точное время — только для свежих меток),
     в подсказке — полная дата; элемент сам обновляется (H.refreshAgo). */
  H.timeHtml = function (iso, lang) {
    const d = new Date(iso); if (isNaN(d)) return '';
    const rel = H.timeAgo(iso, lang);
    const fresh = (H.now() - d.getTime()) < 24 * 3600 * 1000;
    const o = tkParts(d);
    const exact = fresh ? ` · ${o.hour}:${o.minute}` : '';
    const esc = x => String(x).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    return `<time class="js-ago" datetime="${esc(iso)}" title="${esc(H.formatDateTime(iso))} (Asia/Tashkent)" data-fresh="${fresh ? 1 : 0}">${esc(rel)}${exact}</time>`;
  };
  H.refreshAgo = function () {
    const lang = H.curLang ? H.curLang() : 'ru';
    document.querySelectorAll('time.js-ago').forEach(el => {
      const iso = el.getAttribute('datetime'); if (!iso) return;
      const d = new Date(iso); if (isNaN(d)) return;
      const fresh = (H.now() - d.getTime()) < 24 * 3600 * 1000;
      const o = tkParts(d);
      el.textContent = H.timeAgo(iso, lang) + (fresh ? ` · ${o.hour}:${o.minute}` : '');
    });
  };
  setInterval(() => { if (!document.hidden) H.refreshAgo(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) H.refreshAgo(); });

  /* ---------- тексты ошибок API ---------- */
  const ERR = {
    ru: {
      contact_required: 'Укажите контакт: Telegram (@username) или номер телефона — без него заявка не создаётся',
      account_blocked: 'Аккаунт заблокирован',
      own_order: 'Нельзя откликнуться на свою заявку',
      cannot_vote_own: 'За свою карточку голосовать нельзя',
      invalid_category: 'Выберите категорию из списка',
      invalid_google_token: 'Не удалось войти через Google. Попробуйте ещё раз',
      email_not_verified: 'E-mail Google-аккаунта не подтверждён',
      too_many_attempts: 'Слишком много попыток, подождите немного',
      not_authenticated: 'Войдите, чтобы продолжить',
    },
    uz: {
      contact_required: "Kontakt kiriting: Telegram (@username) yoki telefon raqami — usiz buyurtma yaratilmaydi",
      account_blocked: 'Akkaunt bloklangan',
      own_order: "O'z buyurtmangizga javob bera olmaysiz",
      cannot_vote_own: "O'z kartangizga ovoz berib bo'lmaydi",
      invalid_category: "Ro'yxatdan kategoriyani tanlang",
      invalid_google_token: "Google orqali kirib bo'lmadi. Qayta urinib ko'ring",
      email_not_verified: 'Google akkauntining e-pochtasi tasdiqlanmagan',
      too_many_attempts: "Juda ko'p urinish, biroz kuting",
      not_authenticated: 'Davom etish uchun kiring',
    },
  };
  H.errText = function (code, lang) {
    const d = ERR[lang === 'uz' ? 'uz' : 'ru'];
    return d[code] || (lang === 'uz' ? "Xatolik yuz berdi. Qayta urinib ko'ring" : 'Ошибка. Попробуйте ещё раз');
  };

  /* ---------- плашка «часть заявок скрыта из-за задержки» ----------
     data — ответ GET /api/orders: {plan, delay_seconds, hidden_count, hidden_next_in_seconds}.
     Возвращает HTML строки (или '' если скрытых нет). */
  H.delayBannerHtml = function (data, lang) {
    if (!data || !data.hidden_count) return '';
    const mins = Math.max(1, Math.round((data.hidden_next_in_seconds || 60) / 60));
    const ru = lang !== 'uz';
    const left = ru
      ? `Ещё ${data.hidden_count} нов. заявок появятся в вашей ленте примерно через ${mins} мин.`
      : `Yana ${data.hidden_count} ta yangi buyurtma taxminan ${mins} daqiqadan so'ng ko'rinadi.`;
    const up = data.plan === 'premium' ? '' : (ru
      ? `<br><b>Стандарт — 60 000 сум/мес</b>: заявки от 5 минут. <b>Премиум — 100 000 сум/мес</b>: заявки сразу. <a href="https://t.me/${(window.HuntaBot || 'huntaklientbot')}" target="_blank" rel="noopener">Подключить в боте →</a>`
      : `<br><b>Standart — 60 000 so'm/oy</b>: buyurtmalar 5 daqiqadan. <b>Premium — 100 000 so'm/oy</b>: buyurtmalar darhol. <a href="https://t.me/${(window.HuntaBot || 'huntaklientbot')}" target="_blank" rel="noopener">Botda ulash →</a>`);
    return `<div class="delay-banner">⏱ ${left}${up}</div>`;
  };

  H.config().then(c => { if (c && c.bot_username) window.HuntaBot = c.bot_username; });
  H.syncClock();
})();

</script>
<script>
/* Навигация: быстрый поиск (Ctrl+K или «/»), нижняя панель на телефоне, кнопка «Наверх»,
   состояние фильтров в адресной строке (работает кнопка «Назад», ссылками можно делиться).
   Подключается на index / cabinet / freelancers / vacancies после common.js. */
(function () {
  'use strict';
  const H = window.Hunta = window.Hunta || {};

  const TXT = {
    ru: { home: 'Главная', orders: 'Заявки', people: 'Исполнители', jobs: 'Вакансии', search: 'Поиск',
          ph: 'Куда перейти? Например: логотип, n8n, вакансии…', pages: 'Разделы', cats: 'Категории',
          hint: 'Введите категорию или раздел', none: 'Ничего не найдено', top: 'Наверх',
          in_people: 'Исполнители', in_orders: 'Заявки', in_jobs: 'Вакансии', esc: 'Esc — закрыть', open: 'Быстрый поиск (Ctrl+K)',
          mine: 'Мои заявки и сообщения' },
    uz: { home: 'Bosh sahifa', orders: 'Buyurtmalar', people: 'Ijrochilar', jobs: 'Vakansiyalar', search: 'Qidiruv',
          ph: 'Qayerga o‘tamiz? Masalan: logotip, n8n, vakansiyalar…', pages: 'Bo‘limlar', cats: 'Kategoriyalar',
          hint: 'Kategoriya yoki bo‘lim nomini yozing', none: 'Hech narsa topilmadi', top: 'Yuqoriga',
          in_people: 'Ijrochilar', in_orders: 'Buyurtmalar', in_jobs: 'Vakansiyalar', esc: 'Esc — yopish', open: 'Tezkor qidiruv (Ctrl+K)',
          mine: 'Mening buyurtmalarim va xabarlarim' },
    en: { home: 'Home', orders: 'Orders', people: 'Freelancers', jobs: 'Jobs', search: 'Search',
          ph: 'Where to? e.g. logo, n8n, jobs…', pages: 'Sections', cats: 'Categories',
          hint: 'Type a category or section', none: 'Nothing found', top: 'Back to top',
          in_people: 'Freelancers', in_orders: 'Orders', in_jobs: 'Jobs', esc: 'Esc — close', open: 'Quick search (Ctrl+K)',
          mine: 'My orders and messages' },
  };
  const L = () => { const l = H.curLang ? H.curLang() : 'ru'; return TXT[l] ? l : 'ru'; };
  const T = () => TXT[L()];

  const PAGES = [
    { href: 'index.html',       k: 'home',   icon: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>' },
    { href: 'cabinet.html',     k: 'orders', icon: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>' },
    { href: 'freelancers.html', k: 'people', icon: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>' },
    { href: 'vacancies.html',   k: 'jobs',   icon: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3"/>' },
  ];
  /* Раздел по адресу: /freelancers/logo, /orders, /vacancies/seo, /@name, /order/12, а также старые *.html */
  const SEG = location.pathname.split('/').filter(Boolean);
  const SEC_FILE = { freelancers: 'freelancers.html', orders: 'cabinet.html', vacancies: 'vacancies.html' };
  const SEC_BY_FILE = { 'freelancers.html': 'freelancers', 'cabinet.html': 'orders', 'vacancies.html': 'vacancies' };
  const here = (function () {
    const first = (SEG[0] || '').toLowerCase();
    if (SEC_FILE[first]) return SEC_FILE[first];
    if (first.charAt(0) === '@') return 'freelancers.html';
    if (first === 'order' || !first) return 'index.html';
    return first;
  })();
  const SECTION = SEC_BY_FILE[here] || null; // freelancers | orders | vacancies | null
  const CAT_RE = /^[a-z0-9_]+$/i;
  const svg = p => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const SEARCH = '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>';
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

  /* ---------- URL <-> фильтры ---------- */
  H.urlGet = function () {
    const p = new URLSearchParams(location.search);
    const fromPath = (SECTION && SEC_FILE[(SEG[0] || '').toLowerCase()] && SEG[1] && CAT_RE.test(SEG[1])) ? SEG[1] : '';
    return { category: fromPath || p.get('category') || '', q: p.get('q') || '', sort: p.get('sort') || '' };
  };
  /* patch: {category, q, sort}; пустое значение убирает параметр. push=true — новая запись истории (для «Назад»). */
  H.urlSet = function (patch, push) {
    try {
      const p = new URLSearchParams(location.search);
      let path = location.pathname;
      Object.keys(patch).forEach(k => {
        const v = patch[k];
        if (k === 'category' && SECTION && !p.get('order')) {
          // красивый адрес: /freelancers/logo вместо ?category=logo
          path = '/' + SECTION + (v ? '/' + encodeURIComponent(v) : '');
          p.delete('category');
        } else if (v === null || v === undefined || v === '' || (k === 'sort' && v === 'new')) p.delete(k);
        else p.set(k, v);
      });
      const qs = p.toString();
      const url = path + (qs ? '?' + qs : '') + location.hash;
      if (url === location.pathname + location.search + location.hash) return;
      history[push ? 'pushState' : 'replaceState']({ hunta: 1 }, '', url);
    } catch (e) { /* не критично */ }
  };
  window.addEventListener('popstate', () => { if (document.querySelector('[data-filters]') || /freelancers|vacancies|cabinet/.test(here)) location.reload(); });

  /* ---------- нижняя панель (телефон) ---------- */
  function buildBottomBar() {
    if (document.getElementById('hnBar')) return;
    const bar = document.createElement('nav');
    bar.id = 'hnBar'; bar.className = 'hn-bar'; bar.setAttribute('aria-label', 'Main');
    document.body.appendChild(bar);
    document.body.classList.add('hn-has-bar');
    paintBar();
  }
  function paintBar() {
    const bar = document.getElementById('hnBar'); if (!bar) return;
    const t = T();
    bar.innerHTML = PAGES.map(p =>
      `<a class="hn-tab${p.href === here ? ' on' : ''}" href="${p.href}"${p.href === here ? ' aria-current="page"' : ''}>${svg(p.icon)}<span>${esc(t[p.k])}</span></a>`
    ).join('') + `<button type="button" class="hn-tab" id="hnBarSearch">${svg(SEARCH)}<span>${esc(t.search)}</span></button>`;
    bar.querySelector('#hnBarSearch').addEventListener('click', openPalette);
  }

  /* ---------- плавающие кнопки: поиск (десктоп) и «Наверх» ---------- */
  function buildFabs() {
    if (document.getElementById('hnFabs')) return;
    const box = document.createElement('div'); box.id = 'hnFabs'; box.className = 'hn-fabs';
    box.innerHTML = `<button type="button" class="hn-fab hn-fab-search" id="hnFabSearch">${svg(SEARCH)}<kbd>Ctrl K</kbd></button>` +
      `<button type="button" class="hn-fab hn-fab-top" id="hnFabTop" hidden>${svg('<path d="M12 19V5M5 12l7-7 7 7"/>')}</button>`;
    document.body.appendChild(box);
    const top = box.querySelector('#hnFabTop'), s = box.querySelector('#hnFabSearch');
    s.addEventListener('click', openPalette);
    top.addEventListener('click', () => window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }));
    let tick = false;
    window.addEventListener('scroll', () => {
      if (tick) return; tick = true;
      requestAnimationFrame(() => { top.hidden = window.scrollY < 700; tick = false; });
    }, { passive: true });
    paintFabs();
  }
  function paintFabs() {
    const s = document.getElementById('hnFabSearch'), top = document.getElementById('hnFabTop'); if (!s) return;
    s.title = s.ariaLabel = T().open; top.title = top.ariaLabel = T().top;
  }

  /* ---------- быстрый поиск ---------- */
  let pal = null, rows = [], act = 0;
  function destDefault() { return /vacancies/.test(here) ? 'vacancies.html' : /cabinet/.test(here) ? 'cabinet.html' : 'freelancers.html'; }
  function buildPalette() {
    pal = document.createElement('div');
    pal.className = 'hn-pal'; pal.hidden = true;
    pal.innerHTML = `<div class="hn-pal-box" role="dialog" aria-modal="true">
      <div class="hn-pal-in">${svg(SEARCH)}<input type="text" autocomplete="off" spellcheck="false" aria-label="Search"><kbd class="hn-esc">Esc</kbd></div>
      <div class="hn-pal-list" role="listbox"></div></div>`;
    document.body.appendChild(pal);
    pal.addEventListener('mousedown', e => { if (e.target === pal) closePalette(); });
    const input = pal.querySelector('input');
    input.addEventListener('input', render);
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); const r = rows[act]; if (r) go(r.href); }
      else if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
    });
    pal.querySelector('.hn-pal-list').addEventListener('click', e => {
      const a = e.target.closest('[data-href]'); if (a) go(a.dataset.href);
    });
    pal.querySelector('.hn-pal-list').addEventListener('mousemove', e => {
      const a = e.target.closest('[data-i]'); if (a && +a.dataset.i !== act) { act = +a.dataset.i; paint(false); }
    });
  }
  function go(href) { closePalette(); location.href = href; }
  function move(d) { if (!rows.length) return; act = (act + d + rows.length) % rows.length; paint(true); }
  function paint(scroll) {
    pal.querySelectorAll('[data-i]').forEach(el => el.classList.toggle('act', +el.dataset.i === act));
    const el = pal.querySelector('[data-i].act'); if (el && scroll) el.scrollIntoView({ block: 'nearest' });
  }
  async function render() {
    const t = T(), l = L(), list = pal.querySelector('.hn-pal-list');
    const q = H.normText ? H.normText(pal.querySelector('input').value) : pal.querySelector('input').value.trim().toLowerCase();
    rows = []; let html = '';
    const pageRows = PAGES.filter(p => p.href !== here).filter(p => !q || (H.normText ? H.normText(t[p.k]) : t[p.k].toLowerCase()).includes(q));
    if (pageRows.length) {
      html += `<div class="hn-sec">${esc(t.pages)}</div>`;
      pageRows.forEach(p => { rows.push({ href: p.href }); html += `<div class="hn-row" data-i="${rows.length - 1}" data-href="${p.href}">${svg(p.icon)}<span class="hn-name">${esc(t[p.k])}</span></div>`; });
    }
    if (q && H.searchIndex) {
      let idx; try { idx = await H.searchIndex(); } catch (e) { idx = null; }
      if (idx) {
        const scored = [];
        idx.flat.forEach(c => { const e = idx.map[c.key]; const s = e && H.scoreCategory(e, q, l); if (s) scored.push({ c, g: e.g, s }); });
        scored.sort((a, b) => b.s - a.s);
        const top = scored.slice(0, 8);
        if (top.length) {
          html += `<div class="hn-sec">${esc(t.cats)}</div>`;
          const base = destDefault();
          top.forEach(({ c, g }) => {
            const nm = c[l] || c.ru, grp = (g && (g[l] || g.ru)) || '';
            const main = `${base}?category=${encodeURIComponent(c.key)}`;
            rows.push({ href: main });
            const i = rows.length - 1;
            const chips = [['freelancers.html', t.in_people], ['cabinet.html', t.in_orders], ['vacancies.html', t.in_jobs]]
              .map(([h, n]) => `<a class="hn-chip${h === base ? ' main' : ''}" href="${h}?category=${encodeURIComponent(c.key)}" data-href="${h}?category=${encodeURIComponent(c.key)}">${esc(n)}</a>`).join('');
            html += `<div class="hn-row hn-cat" data-i="${i}" data-href="${esc(main)}"><span class="hn-name">${esc(nm)}<small>${esc(grp)}</small></span><span class="hn-chips">${chips}</span></div>`;
          });
        }
      }
    }
    if (!rows.length) html = `<div class="hn-empty">${esc(q ? t.none : t.hint)}</div>`;
    list.innerHTML = html + `<div class="hn-foot">${esc(t.esc)}</div>`;
    // chip-ссылки внутри строки: клик по чипу не должен срабатывать как клик по строке
    list.querySelectorAll('.hn-chip').forEach(a => a.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); go(a.dataset.href); }));
    act = 0; paint(false);
  }
  let lastFocus = null;
  function openPalette() {
    if (!pal) buildPalette();
    lastFocus = document.activeElement;
    const input = pal.querySelector('input'); input.placeholder = T().ph; input.value = '';
    pal.hidden = false; document.documentElement.classList.add('hn-lock');
    render(); setTimeout(() => input.focus(), 0);
  }
  function closePalette() {
    if (!pal) return;
    pal.hidden = true; document.documentElement.classList.remove('hn-lock');
    if (lastFocus && lastFocus.focus) try { lastFocus.focus({ preventScroll: true }); } catch (e) {}
  }
  H.openQuickSearch = openPalette;

  /* скелетон на время загрузки списка (только если список пуст — повторные подгрузки не мигают) */
  H.skeleton = function (grid, n) {
    if (!grid || grid.children.length) return;
    grid.innerHTML = Array.from({ length: n || 4 }, () => '<div class="hn-skel" aria-hidden="true"><i></i><i></i><i></i></div>').join('');
  };
  /* кнопка «Сбросить фильтры» для пустого результата поиска */
  H.resetBtnHtml = function (lang) {
    const ru = lang !== 'uz';
    return `<button type="button" class="hn-reset" onclick="location.href=location.pathname">${ru ? 'Сбросить фильтры и поиск' : 'Filtr va qidiruvni tozalash'}</button>`;
  };

  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '') || (e.target && e.target.isContentEditable);
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); pal && !pal.hidden ? closePalette() : openPalette(); }
    else if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); openPalette(); }
  });

  /* перекрасить подписи при смене языка (страницы меняют lang по-разному — проверяем раз в секунду дёшево) */
  let seen = L();
  setInterval(() => { const l = L(); if (l !== seen) { seen = l; paintBar(); paintFabs(); if (pal && !pal.hidden) { pal.querySelector('input').placeholder = T().ph; render(); } } }, 800);

  /* Текст для поисковиков (seo.py) после загрузки дублирует живой интерфейс — убираем; на /order/<id> он и есть страница. */
  function dropSeoText() {
    const el = document.getElementById('seo-static');
    if (el && !el.hasAttribute('data-keep')) window.addEventListener('load', () => setTimeout(() => el.remove(), 1500));
  }

  function init() { buildBottomBar(); buildFabs(); dropSeoText(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>

function renderCatMarquee(lang){
  const track = document.getElementById('catMarqueeTrack');
  if (!track) return;
  const names = categoryMarquee.map(c => c[lang] || c.ru);
  // Дублируем список дважды, чтобы анимация translateX(-50%) зацикливалась без видимого разрыва.
  const html = names.map(n => `<span>${n}</span>`).join('') ;
  track.innerHTML = html + html;
}

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dataset.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const path = el.getAttribute('data-i18n').split('.');
    let val = translations[lang];
    path.forEach(p=>val = val ? val[p] : null);
    if(val) el.textContent = val;
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const path = el.getAttribute('data-i18n-html').split('.');
    let val = translations[lang];
    path.forEach(p=>val = val ? val[p] : null);
    if(val) el.innerHTML = val;
  });
  document.querySelectorAll('[data-lang-btn]').forEach(b=>{
    b.classList.toggle('active', b.dataset.langBtn === lang);
  });
  renderCatMarquee(lang);
  if(typeof updateAuthTexts === 'function') updateAuthTexts();
  if(typeof updateOrderTexts === 'function') updateOrderTexts();
}

document.querySelectorAll('[data-lang-btn]').forEach(btn=>{
  btn.addEventListener('click', ()=>applyLang(btn.dataset.langBtn));
});
/* Важно: applyLang('ru') вызывается в самом конце файла (см. низ script.js),
   после того как объявлены все const-переменные, включая переменные модалки
   авторизации — иначе применение языка падает с ошибкой ещё до того, как

   FAQ и т.д.), и вся страница выглядит "сломанной". */

document.getElementById('themeToggle').addEventListener('click', ()=>{
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
});

document.querySelectorAll('.faq-item').forEach(item=>{
  const q = item.querySelector('.faq-q');
  const a = item.querySelector('.faq-a');
  q.addEventListener('click',()=>{
    const isOpen = item.classList.contains('open');
    document.querySelectorAll('.faq-item.open').forEach(o=>{
      o.classList.remove('open');
      o.querySelector('.faq-a').style.maxHeight = null;
    });
    if(!isOpen){
      item.classList.add('open');
      a.style.maxHeight = a.scrollHeight + 'px';
    }
  });
});

/* ---------- PROFILE MODAL ---------- */
const modalOverlay = document.getElementById('profileModalOverlay');
const modalClose = document.getElementById('modalClose');
const modalPhoto = document.getElementById('modalPhoto');
const modalName = document.getElementById('modalName');
const modalRole = document.getElementById('modalRole');
const modalBio = document.getElementById('modalBio');
const modalWriteBtn = document.getElementById('modalWriteBtn');

function openProfileModal(card){
  const key = card.dataset.profile;
  const data = translations[currentLang].profiles[key];
  if(!data) return;
  const photoSrc = card.querySelector('img').getAttribute('src');
  modalPhoto.src = photoSrc;
  modalName.textContent = data.name;
  modalRole.textContent = data.role;
  modalBio.textContent = data.bio;
  modalWriteBtn.href = card.dataset.tg;
  modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeProfileModal(){
  modalOverlay.classList.remove('open');
  document.body.style.overflow = '';
}

document.querySelectorAll('.profile-card').forEach(card=>{
  card.addEventListener('click', (e)=>{
    if(e.target.closest('.write-btn')) return;
    openProfileModal(card);
  });
  const writeBtn = card.querySelector('.write-btn');
  writeBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    window.open(card.dataset.tg, '_blank');
  });
});

modalClose.addEventListener('click', closeProfileModal);
modalOverlay.addEventListener('click', (e)=>{
  if(e.target === modalOverlay) closeProfileModal();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeProfileModal();
});

/* ---------- AUTH MODAL (вход / регистрация через телефон + код из Telegram-бота) ----------
   ВАЖНО: requestAuthCode() и verifyAuthCode() ниже — это ЗАГЛУШКИ.
   Реальный запрос кода и его проверка должны идти в ваш Telegram-бот (тот же бэкенд,
   что уже используется в ваших aiogram-проектах). Просто замените тела этих двух
   функций на fetch() к своим эндпоинтам, например:
     POST /api/auth/request-code   { phone }        -> бот отправляет код пользователю в Telegram
     POST /api/auth/verify-code    { phone, code }   -> бот подтверждает код и возвращает токен/сессию
   Повторный вход (если сессия слетела) устроен той же логикой: пользователь снова
   вводит номер телефона, бот присылает новый код, пользователь вводит его — это
   ровно тот же экран "Вход" ниже. ---------- */

      const pending = getPendingOrder();

        clearPendingOrder();

authResendBtn.addEventListener('click', ()=>{

function startResendCountdown(seconds){
  stopResendCountdown();
  resendSeconds = seconds;
  authResendBtn.disabled = true;
  renderResend();
  resendTimerId = setInterval(()=>{
    resendSeconds -= 1;
    renderResend();
    if(resendSeconds <= 0) stopResendCountdown();
  }, 1000);
}

function stopResendCountdown(){
  if(resendTimerId){ clearInterval(resendTimerId); resendTimerId = null; }
  resendSeconds = 0;
  authResendBtn.disabled = false;
  authResendBtn.textContent = t('auth.resend');
}

function renderResend(){
  if(resendSeconds > 0){
    authResendBtn.disabled = true;
    authResendBtn.textContent = t('auth.resendIn') + ' ' + resendSeconds + 'с';
  } else {
    authResendBtn.disabled = false;
    authResendBtn.textContent = t('auth.resend');
  }
}

/* ---------- ORDER MODAL (разместить заказ без регистрации) ----------
   Гость заполняет форму сразу, без входа. Регистрацию/телефон просим
   только на шаге публикации: если человек ещё не залогинен, черновик
   заказа сохраняется в sessionStorage и открывается модалка регистрации;
   после успешного подтверждения телефона (см. authVerifyBtn выше)
   черновик публикуется автоматически через POST /api/orders. */

const PENDING_ORDER_KEY = 'huntaPendingOrder';

/* Категории грузим из /api/categories (все группы сайта) — см. common.js */

const orderOverlay      = document.getElementById('orderModalOverlay');
const orderModalClose   = document.getElementById('orderModalClose');
const orderTitleInput   = document.getElementById('orderTitleInput');
const orderCategorySel  = document.getElementById('orderCategorySelect');
const orderBudgetInput  = document.getElementById('orderBudgetInput');
const orderDescInput    = document.getElementById('orderDescriptionInput');
const orderError        = document.getElementById('orderError');
const orderSubmitBtn    = document.getElementById('orderSubmitBtn');

const orderContactInput = document.getElementById('orderContactInput');

function populateOrderCategories(){
  if (!orderCategorySel) return;
  const keep = orderCategorySel.value;
  return Hunta.fillCategorySelect(orderCategorySel, currentLang, t('order.fieldCategoryPh'))
    .then(()=>{ if (keep) orderCategorySel.value = keep; Hunta.enhanceCategorySelect(orderCategorySel); });
}

function updateOrderTexts(){
  if (!orderOverlay) return;
  if (orderTitleInput) orderTitleInput.placeholder = t('order.fieldTitlePh');
  if (orderBudgetInput) orderBudgetInput.placeholder = t('order.fieldBudgetPh');
  if (orderDescInput) orderDescInput.placeholder = t('order.fieldDescriptionPh');
  if (orderContactInput) orderContactInput.placeholder = t('order.fieldContactPh');
  populateOrderCategories();
}

function openOrderModal(){
  if (!orderOverlay) return;
  updateOrderTexts();
  orderError.textContent = '';
  orderSubmitBtn.disabled = false;
  orderSubmitBtn.textContent = t('order.submit');
  orderOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  orderTitleInput.focus();
}

function closeOrderModal(){
  orderOverlay.classList.remove('open');
  document.body.style.overflow = '';
}

if (orderOverlay){
  // Ссылка "Разместить заказ" убрана из header — там её больше нет, поэтому
  // элемент может отсутствовать; проверяем перед навешиванием обработчика.
  const postOrderLink = document.getElementById('postOrderLink');
  if (postOrderLink) postOrderLink.addEventListener('click', (e)=>{ e.preventDefault(); openOrderModal(); });

  const heroLink = document.getElementById('heroPostOrderLink');
  if (heroLink) heroLink.addEventListener('click', (e)=>{ e.preventDefault(); openOrderModal(); });

  orderModalClose.addEventListener('click', closeOrderModal);
  orderOverlay.addEventListener('click', (e)=>{ if(e.target === orderOverlay) closeOrderModal(); });
  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && orderOverlay.classList.contains('open')) closeOrderModal(); });

  orderSubmitBtn.addEventListener('click', async ()=>{
    orderError.textContent = '';
    const draft = {
      title: orderTitleInput.value.trim(),
      category_key: orderCategorySel.value,
      description: orderDescInput.value.trim(),
      budget: orderBudgetInput.value,
      contact: orderContactInput ? orderContactInput.value.trim() : '',
    };
    if (!draft.title || !draft.category_key || !draft.budget){
      orderError.textContent = t('order.errRequired');
      return;
    }
    if (!draft.contact){
      orderError.textContent = t('order.errContact');
      return;
    }
    const budgetNum = Number(draft.budget);
    if (!Number.isFinite(budgetNum) || budgetNum <= 0){
      orderError.textContent = t('order.errBudget');
      return;
    }
    draft.budget = budgetNum;

    orderSubmitBtn.disabled = true;
    orderSubmitBtn.textContent = t('order.submitting');

    try {
      const me = await fetch(`${API_BASE}/auth/me`, {credentials:'include'});
      if (me.ok){
        const user = await me.json().catch(()=>({}));
        const created = await submitOrderDraft(draft);
        closeOrderModal();
        if (created && created.id){
          window.location.href = `cabinet.html?order=${created.id}`;
        } else {
          window.location.href = 'cabinet.html';
        }
        return;
      }
    } catch(err){
      if (err && err.message && err.message !== 'Failed to fetch' && err.message !== 'create_failed'){
        orderError.textContent = Hunta.errText(err.message, currentLang);
        orderSubmitBtn.disabled = false;
        orderSubmitBtn.textContent = t('order.submit');
        return;
      }
      /* не залогинен или сеть — уходим в гостевой сценарий ниже */
    }

    // Гость: сохраняем черновик и просим подтвердить телефон, чтобы
    // опубликовать заказ — само заполнение формы регистрации не требовало.
    savePendingOrder(draft);
    closeOrderModal();
    openAuthModal('register');
    authPhoneHint.textContent = t('order.pendingNote');
  });
}

function savePendingOrder(draft){
  try { sessionStorage.setItem(PENDING_ORDER_KEY, JSON.stringify(draft)); } catch(e){}
}
function getPendingOrder(){
  try {
    const raw = sessionStorage.getItem(PENDING_ORDER_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function clearPendingOrder(){
  try { sessionStorage.removeItem(PENDING_ORDER_KEY); } catch(e){}
}
function submitOrderDraft(draft){
  return fetch(`${API_BASE}/orders`, {
    method: 'POST',
    credentials: 'include',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(draft),
  }).then(async (resp)=>{
    if (!resp.ok){
      const data = await resp.json().catch(()=>({}));
      throw new Error(data.error || 'create_failed');
    }
    return resp.json();
  });
}

/* Анимация появления карточек отзывов при скролле */
(function initTestiReveal(){
  const cards = document.querySelectorAll('.testi');
  if (!cards.length) return;
  if (!('IntersectionObserver' in window)){
    cards.forEach(c=>c.classList.add('in-view'));
    return;
  }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach((entry, i)=>{
      if (entry.isIntersecting){
        setTimeout(()=>entry.target.classList.add('in-view'), i * 90);
        io.unobserve(entry.target);
      }
    });
  }, {threshold:.2});
  cards.forEach(c=>io.observe(c));
})();

/* Sticky-CTA снизу на мобильном (см. index.html #mobileStickyCta): показываем,
   как только hero прокручен за верх экрана, прячем у самого начала страницы
   и пока открыта любая модалка (auth/order/profile) — чтобы не перекрывать их. */
(function initMobileStickyCta(){
  const bar = document.getElementById('mobileStickyCta');
  const hero = document.querySelector('.hero-photo-section');
  if (!bar || !hero) return;

  const overlays = ['#authModalOverlay', '#orderModalOverlay', '#profileModalOverlay']
    .map(sel => document.querySelector(sel))
    .filter(Boolean);

  function anyModalOpen(){
    return overlays.some(el => el.classList.contains('open'));
  }
  function update(){
    const heroBottom = hero.getBoundingClientRect().bottom;
    bar.classList.toggle('is-visible', heroBottom < 0 && !anyModalOpen());
  }

  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  overlays.forEach(el => {
    new MutationObserver(update).observe(el, { attributes: true, attributeFilter: ['class'] });
  });
  update();
})();

(function () {

  const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const FS = `
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform float uSweep; uniform vec2 uCenter; uniform float uR;

float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y); }
float fbm(vec2 p){ float v=0.,a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.03+vec2(17.1,9.2); a*=.5; } return v; }

  float t=uTime*0.025;
  vec2 warp=vec2(fbm(w+t),fbm(w+vec2(5.2,1.3)-t));
  float h=fbm(w*1.05+warp*1.5+t*.4);
  float lv=h*18.;
  float c=abs(fract(lv)-.5);
  float line=smoothstep(.452,.5,c);
  float major=step(mod(floor(lv+.5),4.),.5);

  float ang=atan(q.y,q.x);
  float diff=mod(uSweep-ang,6.2831853);
  float f=1.-smoothstep(.9,1.45,d);
  float trail=exp(-diff*1.7)*f;
  float edge=exp(-diff*16.)*f;

  vec3 ink=vec3(.059,.051,.039), amber=vec3(.941,.675,.235), teal=vec3(.18,.612,.549), bone=vec3(.98,.969,.945);
  vec3 col=ink;
  float far=1.-smoothstep(.0,3.2,d)*.55;
  col+=amber*line*(.075+major*.085)*far;
  col+=amber*line*(trail*1.5+edge*1.1);
  col+=amber*trail*.055+amber*edge*.10;

  float disc=1.-smoothstep(1.,1.012,d);
  float ring=0.;
  ring+=exp(-pow((d-.34)*70.,2.))+exp(-pow((d-.67)*70.,2.))+exp(-pow((d-1.)*70.,2.))*1.6;
  float cross=exp(-pow(q.x*140.,2.))+exp(-pow(q.y*140.,2.));
  col+=bone*(ring*.085+cross*.035*disc);

  for(int i=0;i<8;i++){
    vec4 pg=uPing[i];
    if(pg.w>.5){
      vec2 pr=(frag-pg.xy)/uR;
      float r=length(pr), a=pg.z;
      float rr=a*.26;
      float wave=exp(-pow((r-rr)*34.,2.))*exp(-a*.75);
      float core=exp(-pow(r/.011,2.))*(.55+.45*sin(uTime*7.+float(i)));
      float halo=exp(-r*7.)*exp(-a*.55);
      col+=teal*(wave*.9+halo*.35)+bone*core*.9+teal*core;
      col+=amber*line*halo*.9;
    }
  }
  float vig=length((frag/uRes-.5)*vec2(1.,.85));
  col*=1.-.38*vig;
  col*=mix(1.-uDim,1.,smoothstep(.05,.62,frag.x/uRes.x));
  col+=(hash(frag+uTime)-.5)*.018;
  gl_FragColor=vec4(col,1.);
}`;

  function compile(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(s)); return null; }
    return s;
  }
  const vs = compile(gl.VERTEX_SHADER, VS), fs = compile(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) { hero.classList.add('hx-nogl'); return; }
  const prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { hero.classList.add('hx-nogl'); return; }
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);
  const u = { res: U('uRes'), time: U('uTime'), sweep: U('uSweep'), center: U('uCenter'), r: U('uR'), mouse: U('uMouse'), dim: U('uDim'), ping: U('uPing') };

  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); running = false; hero.classList.add('hx-nogl'); });

  /* ---------- геометрия радара ---------- */
  let W = 0, H = 0, k = 1, cx = 0, cy = 0, R = 0, copyRight = 0;
  function layout() {
    const rect = hero.getBoundingClientRect();
    W = rect.width; H = rect.height;
    const mobile = isMobile();
    const scale = mobile ? .62 : Math.min(window.devicePixelRatio || 1, 1.6);
    k = scale;
    canvas.width = Math.round(W * k); canvas.height = Math.round(H * k);
    if (mobile) { cx = W * .5; cy = H * .72; R = Math.min(W * .78, H * .42); }
    else { cx = W * .69; cy = H * .5; R = Math.min(H * .43, W * .27); }
    const copy = hero.querySelector('.hx-copy');
    copyRight = copy ? copy.getBoundingClientRect().right - rect.left : 0;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(u.res, canvas.width, canvas.height);
    gl.uniform2f(u.center, cx * k, (H - cy) * k);
    gl.uniform1f(u.r, R * k);
    gl.uniform1f(u.dim, mobile ? .5 : .42);
  }

  /* ---------- цели: точки, которые луч «находит» ---------- */
  const N = 7;
  const targets = [];
  function seedTarget(i) {
    const mobile = isMobile();
    // углы вокруг радара; справа и сверху/снизу — чтобы карточки не лезли на текст слева
    const a = (mobile ? Math.random() * Math.PI * 2 : (-1.15 + Math.random() * 2.3));  // desktop: правая половина
    const rr = .28 + Math.random() * .62;
    targets[i] = { a: (a + Math.PI * 2) % (Math.PI * 2), rr, age: -1, ticket: null, wait: 0 };
  }
  for (let i = 0; i < N; i++) seedTarget(i);

  const pingData = new Float32Array(32);
  function pos(t) { return { x: cx + Math.cos(t.a) * t.rr * R, y: cy - Math.sin(t.a) * t.rr * R }; }

  let sampleIdx = Math.floor(Math.random() * SAMPLES.length);
  function spawnTicket(t, persist) {
    if (!layer || isMobile()) return null;
    if (layer.querySelectorAll('.hx-ticket').length >= 3) return null;
    const s = SAMPLES[sampleIdx++ % SAMPLES.length];
    const L = lang();
    const c = catName[s.cat];
    const cname = c ? (c[L] || c.ru) : s.cat;
    const el = document.createElement('div');
    el.className = 'hx-ticket';
    el.innerHTML =
      `<span class="hx-t-cat">${cname}</span>` +
      `<span class="hx-t-title">${s.t[L] || s.t.ru}</span>` +
      `<span class="hx-t-row"><b>${s.b.toLocaleString('ru-RU')} ${L === 'uz' ? 'so‘m' : (L === 'en' ? 'UZS' : 'сум')}</b><i>${TAG[L] || TAG.ru}</i></span>`;
    layer.appendChild(el);
    const p = pos(t);
    const w = el.offsetWidth, h = el.offsetHeight;
    // карточка со смещением от точки, внутри экрана и правее текстового блока
    let x = p.x + 18, y = p.y - h - 14;
    if (x + w > W - 12) x = p.x - w - 18;
    x = Math.max(copyRight + 20, Math.min(x, W - w - 12));
    y = Math.max(78, Math.min(y, H - h - 24));
    el.style.transform = `translate(${x}px,${y}px)`;
    // линия от ближайшей точки карточки к найденной точке на радаре
    const px = p.x - x, py = p.y - y, ax = Math.max(0, Math.min(px, w)), ay = Math.max(0, Math.min(py, h));
    el.style.setProperty('--ax', ax + 'px'); el.style.setProperty('--ay', ay + 'px');
    el.style.setProperty('--len', Math.hypot(px - ax, py - ay) + 'px');
    el.style.setProperty('--ang', Math.atan2(py - ay, px - ax) + 'rad');
    requestAnimationFrame(() => el.classList.add('in'));
    if (!persist) {
      setTimeout(() => { el.classList.remove('in'); el.classList.add('out'); }, 4600);
      setTimeout(() => el.remove(), 5400);
    }
    return el;
  }

  /* ---------- цикл ---------- */
  let running = false, raf = 0, t0 = performance.now(), last = t0, sweep = 0, prevSweep = 0;
  const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener('pointermove', e => {
    const r = hero.getBoundingClientRect();
    mouse.tx = (e.clientX - r.left) / r.width - .5; mouse.ty = -((e.clientY - r.top) / r.height - .5);
  }, { passive: true });

  function frame(now) {
    if (!running) return;
    const dt = Math.min((now - last) / 1000, .05); last = now;
    const time = (now - t0) / 1000;
    prevSweep = sweep; sweep = (sweep + dt * .52) % (Math.PI * 2);
    mouse.x += (mouse.tx - mouse.x) * .04; mouse.y += (mouse.ty - mouse.y) * .04;

    for (let i = 0; i < N; i++) {
      const t = targets[i];
      if (t.age >= 0) { t.age += dt; if (t.age > 6.5) { t.age = -1; seedTarget(i); } }
      else {
        const crossed = prevSweep <= sweep ? (t.a > prevSweep && t.a <= sweep) : (t.a > prevSweep || t.a <= sweep);
        if (crossed) { t.age = 0; t.ticket = spawnTicket(t); }
      }
      const p = pos(t);
      pingData[i * 4] = p.x * k; pingData[i * 4 + 1] = (H - p.y) * k;
      pingData[i * 4 + 2] = Math.max(t.age, 0); pingData[i * 4 + 3] = t.age >= 0 ? 1 : 0;
    }
    draw(time);
    raf = requestAnimationFrame(frame);
  }
  function draw(time) {
    gl.uniform1f(u.time, time); gl.uniform1f(u.sweep, sweep);
    gl.uniform2f(u.mouse, mouse.x, mouse.y);
    gl.uniform4fv(u.ping, pingData);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function start() { if (running || reduce) return; running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
  function stop() { running = false; cancelAnimationFrame(raf); }

  layout();
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { layout(); if (reduce) staticFrame(); }, 120); });

  function staticFrame() {
    // «уменьшить движение»: один кадр с тремя найденными точками, без анимации
    sweep = 2.35;
    [0.5, 1.4, 5.3].forEach((a, i) => { targets[i].a = a; targets[i].rr = .35 + i * .22; targets[i].age = .7 + i * .4; });
    for (let i = 0; i < N; i++) {
      const p = pos(targets[i]);
      pingData[i * 4] = p.x * k; pingData[i * 4 + 1] = (H - p.y) * k; pingData[i * 4 + 2] = Math.max(targets[i].age, 0); pingData[i * 4 + 3] = targets[i].age >= 0 ? 1 : 0;
    }
    draw(6);
    if (layer && !isMobile()) { layer.innerHTML = ''; [0, 1].forEach(i => { spawnTicket(targets[i], true); }); }
  }

  if (reduce) { staticFrame(); }
  else {
    const io = new IntersectionObserver(es => es.forEach(e => (e.isIntersecting ? start() : stop())), { threshold: 0.05 });
    io.observe(hero);
    document.addEventListener('visibilitychange', () => { document.hidden ? stop() : (hero.getBoundingClientRect().bottom > 0 && start()); });
  }
  hero.classList.add('hx-ready');

  /* ---------- заголовок: сборка по буквам (один раз при загрузке) ---------- */
  (function intro() {
    const h1 = hero.querySelector('.hx-title');
    if (!h1 || reduce) return;
    const text = h1.textContent.trim();
    if (!text) return;
    h1.setAttribute('aria-label', text);
    h1.innerHTML = '';
    let n = 0;
    text.split(' ').forEach((word, wi, arr) => {
      const w = document.createElement('span'); w.className = 'hx-word'; w.setAttribute('aria-hidden', 'true');
      [...word].forEach(ch => {
        const s = document.createElement('span'); s.className = 'hx-ch'; s.textContent = ch;
        s.style.animationDelay = (0.12 + n++ * 0.032) + 's'; w.appendChild(s);
      });
      h1.appendChild(w);
      if (wi < arr.length - 1) h1.appendChild(document.createTextNode(' '));
    });
  })();

  /* ---------- живая цифра: заявок за 7 дней ---------- */
  (function live() {
    const el = document.getElementById('hxWeekly');
    if (!el) return;
    fetch('/api/stats/social-proof').then(r => (r.ok ? r.json() : null)).then(d => {
      const target = d && d.orders_last_7_days;
      if (!target || target < 20) { const wrap = document.getElementById('hxLive'); if (wrap) wrap.hidden = true; return; }
      if (reduce) { el.textContent = target.toLocaleString('ru-RU'); return; }
      const t1 = performance.now(), dur = 1400;
      (function tick(now) {
        const p = Math.min((now - t1) / dur, 1), e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(target * e).toLocaleString('ru-RU');
        if (p < 1) requestAnimationFrame(tick);
      })(t1);
    }).catch(() => { const wrap = document.getElementById('hxLive'); if (wrap) wrap.hidden = true; });
  })();
})();

</script>
<script>
/* Карусель отзывов: свайп/перетаскивание мышью, стрелки, точки, автопрокрутка, плавное появление карточек. */
(function(){
  const track=document.getElementById('tcTrack');
  if(!track) return;
  const cards=[...track.querySelectorAll('.tcard')];
  const dotsBox=document.getElementById('tcDots');
  const prev=document.getElementById('tcPrev'), next=document.getElementById('tcNext');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const dots=cards.map((_,i)=>{
    const b=document.createElement('button');
    b.className='tc-dot'; b.type='button'; b.setAttribute('aria-label','Review '+(i+1));
    b.addEventListener('click',()=>goTo(i)); dotsBox.appendChild(b); return b;
  });

  cards.forEach(c=>{
    const img=c.querySelector('.tc-photo img'), box=c.querySelector('.tc-photo');
    const fail=()=>box.classList.add('tc-noimg');
    img.addEventListener('error',fail);
    if(img.complete && img.naturalWidth===0) fail();
  });

  const step=()=>cards[0].getBoundingClientRect().width+22;
  function current(){
    const mid=track.scrollLeft+track.clientWidth/2;
    let best=0,d=1e9;
    cards.forEach((c,i)=>{const x=Math.abs(c.offsetLeft+c.offsetWidth/2-mid); if(x<d){d=x;best=i;}});
    return best;
  }
  function goTo(i){
    i=Math.max(0,Math.min(cards.length-1,i));
    const c=cards[i];
    track.scrollTo({left:c.offsetLeft-(track.clientWidth-c.offsetWidth)/2,behavior:reduce?'auto':'smooth'});
  }
  function paint(){const a=current(); dots.forEach((d,i)=>d.classList.toggle('is-active',i===a));}
  let raf=0;
  track.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(paint);},{passive:true});
  prev.addEventListener('click',()=>{stopAuto();goTo(current()-1);});
  next.addEventListener('click',()=>{stopAuto();goTo(current()+1);});

  /* перетаскивание мышью (тач и так свайпается нативно) */
  let down=false,sx=0,sl=0,moved=false;
  track.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse') return;
    down=true;moved=false;sx=e.clientX;sl=track.scrollLeft;stopAuto();
  });
  window.addEventListener('pointermove',e=>{
    if(!down) return;
    const dx=e.clientX-sx;
    if(Math.abs(dx)>4){moved=true;track.classList.add('is-drag');}
    if(moved) track.scrollLeft=sl-dx;
  });
  window.addEventListener('pointerup',()=>{
    if(!down) return;
    down=false;
    if(moved){track.classList.remove('is-drag');goTo(current());}
  });

  /* появление карточек */
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting){
        const i=cards.indexOf(e.target);
        setTimeout(()=>e.target.classList.add('in-view'),i*120);
        io.unobserve(e.target);
      }
    }),{threshold:.2});
    cards.forEach(c=>io.observe(c));
  } else cards.forEach(c=>c.classList.add('in-view'));

  /* автопрокрутка: пауза при наведении, перетаскивании, скрытой вкладке и вне экрана */
  let timer=null,visible=false,hover=false;
  function tick(){
    if(down||hover||document.hidden||!visible) return;
    const i=current(); goTo(i>=cards.length-1?0:i+1);
  }
  function startAuto(){ if(reduce||timer) return; timer=setInterval(tick,5500); }
  function stopAuto(){ clearInterval(timer); timer=null; }
  track.addEventListener('mouseenter',()=>hover=true);
  track.addEventListener('mouseleave',()=>hover=false);
  track.addEventListener('touchstart',stopAuto,{passive:true});
  if('IntersectionObserver' in window){
    new IntersectionObserver(es=>{visible=es[0].isIntersecting;},{threshold:.35}).observe(track);
  } else visible=true;
  startAuto();
  paint();
})();

</script>
</body>
